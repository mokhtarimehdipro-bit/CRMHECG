<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaire — HECG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --c: #1A4E8A; --a: #F26522; --bg1: #eef3fb; --bg2: #fdf1ea; --txt: #1f2937; --mut: #6b7280; --card: rgba(255,255,255,.86); --brd: rgba(15,23,42,.08); --field: #f8fafc; }
  body.sombre { --bg1: #0b1220; --bg2: #151b2e; --txt: #e5e7eb; --mut: #9ca3af; --card: rgba(17,24,39,.82); --brd: rgba(255,255,255,.08); --field: rgba(255,255,255,.04); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--txt); background: linear-gradient(135deg, var(--bg1), var(--bg2)); background-attachment: fixed; -webkit-font-smoothing: antialiased; }
  body.ronde { font-family: 'Nunito', system-ui, sans-serif; }
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .45; z-index: 0; pointer-events: none; animation: flotte 18s ease-in-out infinite alternate; }
  .b1 { width: 420px; height: 420px; background: var(--c); top: -120px; left: -120px; }
  .b2 { width: 360px; height: 360px; background: var(--a); bottom: -140px; right: -100px; animation-delay: -6s; }
  .b3 { width: 260px; height: 260px; background: #8b5cf6; top: 40%; right: 10%; opacity: .18; animation-delay: -12s; }
  body.aurore .b3 { opacity: .38; }
  @keyframes flotte { to { transform: translate(40px, 30px) scale(1.08); } }
  .barre { position: fixed; top: 0; left: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--c), var(--a)); z-index: 50; transition: width .35s ease; box-shadow: 0 0 12px var(--a); }
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }
  .entete { border-radius: 28px; overflow: hidden; background: var(--card); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--brd); box-shadow: 0 30px 60px -30px rgba(15,23,42,.35); }
  .bandeau { height: 150px; background: linear-gradient(120deg, var(--c), color-mix(in srgb, var(--c) 55%, var(--a))); background-size: cover; background-position: center; position: relative; }
  .bandeau::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, rgba(255,255,255,.35), transparent 45%); }
  .logo { position: absolute; left: 28px; bottom: -30px; width: 64px; height: 64px; border-radius: 18px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 25px -8px rgba(0,0,0,.35); z-index: 2; }
  .logo img { width: 48px; }
  .intro { padding: 44px 28px 26px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -.01em; }
  body.ronde h1 { font-family: 'Nunito', sans-serif; font-weight: 800; }
  .desc { color: var(--mut); font-size: 15.5px; line-height: 1.6; white-space: pre-line; margin: 0; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; font-size: 12.5px; color: var(--mut); }
  .meta span { background: var(--field); border: 1px solid var(--brd); padding: 5px 11px; border-radius: 999px; }
  .section-titre { margin: 34px 6px 4px; font-family: 'Fraunces', serif; font-size: 21px; display: flex; align-items: center; gap: 12px; }
  .section-titre::before { content: ""; width: 26px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--c), var(--a)); }
  .q { margin-top: 16px; background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--brd); border-radius: 22px; padding: 22px 22px 24px;
       transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; animation: monte .5s ease both; }
  .q:focus-within { border-color: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 18px 40px -22px color-mix(in srgb, var(--c) 70%, transparent); transform: translateY(-2px); }
  .q.erreur { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.12); }
  @keyframes monte { from { opacity: 0; transform: translateY(14px); } }
  .lib { font-weight: 600; font-size: 16px; line-height: 1.45; }
  .lib .obl { color: var(--a); margin-left: 4px; }
  .aide { color: var(--mut); font-size: 13.5px; margin-top: 4px; }
  .champ { margin-top: 14px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], textarea, select {
    width: 100%; font: inherit; font-size: 15.5px; color: var(--txt); background: var(--field); border: 1.5px solid var(--brd); border-radius: 14px; padding: 13px 15px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus, select:focus { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 15%, transparent); }
  .puces { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .puce { position: relative; }
  .puce input { position: absolute; opacity: 0; pointer-events: none; }
  .puce label { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; padding: 11px 16px; border-radius: 14px; border: 1.5px solid var(--brd); background: var(--field); font-size: 15px; transition: all .15s; user-select: none; }
  .puce label::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--mut) 60%, transparent); transition: all .15s; flex-shrink: 0; }
  .puce.carre label::before { border-radius: 6px; }
  .puce input:checked + label { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--field)); color: var(--c); font-weight: 600; }
  body.sombre .puce input:checked + label { color: #fff; }
  .puce input:checked + label::before { border-color: var(--c); background: var(--c); box-shadow: inset 0 0 0 3px var(--field); }
  .puce label:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
  .etoiles { display: flex; gap: 6px; margin-top: 14px; }
  .etoiles button { background: none; border: 0; padding: 4px; cursor: pointer; transition: transform .15s; }
  .etoiles button:hover { transform: scale(1.15) rotate(-6deg); }
  .etoiles svg { width: 38px; height: 38px; fill: color-mix(in srgb, var(--mut) 25%, transparent); transition: fill .15s; }
  .etoiles button.on svg { fill: #fbbf24; filter: drop-shadow(0 4px 8px rgba(251,191,36,.45)); }
  .etoiles .val { align-self: center; margin-left: 10px; font-weight: 600; color: var(--mut); font-size: 14px; }
  .echelle { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 14px; }
  .echelle button { font: inherit; font-weight: 700; padding: 13px 0; border-radius: 13px; border: 1.5px solid var(--brd); background: var(--field); color: var(--txt); cursor: pointer; transition: all .15s; }
  .echelle button:hover { border-color: var(--c); transform: translateY(-2px); }
  .echelle button.on { background: var(--c); color: #fff; border-color: var(--c); box-shadow: 0 10px 20px -10px var(--c); }
  .echelle.nps button.on { background: var(--teinte); border-color: var(--teinte); box-shadow: 0 10px 20px -10px var(--teinte); }
  .bornes { display: flex; justify-content: space-between; color: var(--mut); font-size: 12.5px; margin-top: 8px; }
  .ouinon { display: flex; gap: 10px; margin-top: 14px; }
  .ouinon button { flex: 1; font: inherit; font-weight: 600; padding: 14px; border-radius: 14px; border: 1.5px solid var(--brd); background: var(--field); color: var(--txt); cursor: pointer; transition: all .15s; }
  .ouinon button.on.oui { background: #10b981; border-color: #10b981; color: #fff; }
  .ouinon button.on.non { background: #64748b; border-color: #64748b; color: #fff; }
  .msgerr { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
  .q.erreur .msgerr { display: block; }
  .pied { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .envoyer { font: inherit; font-weight: 700; font-size: 16.5px; color: #fff; border: 0; border-radius: 16px; padding: 16px 44px; cursor: pointer; background: linear-gradient(120deg, var(--c), var(--a));
             box-shadow: 0 18px 35px -15px var(--a); transition: transform .15s, box-shadow .15s, opacity .15s; }
  .envoyer:hover { transform: translateY(-2px); box-shadow: 0 22px 40px -15px var(--a); }
  .envoyer:disabled { opacity: .6; cursor: wait; transform: none; }
  .note { font-size: 12.5px; color: var(--mut); text-align: center; }
  .hp { position: absolute; left: -9999px; }
  .etat { text-align: center; padding: 60px 28px; }
  .coche { width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #34d399); display: grid; place-items: center; box-shadow: 0 20px 40px -15px #10b981; animation: pop .5s cubic-bezier(.3,1.6,.6,1) both; }
  .coche svg { width: 46px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-dasharray: 60; stroke-dashoffset: 60; animation: trace .5s .3s ease forwards; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  @keyframes trace { to { stroke-dashoffset: 0; } }
  .chargement { display: grid; place-items: center; min-height: 60vh; }
  .rond { width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--c) 20%, transparent); border-top-color: var(--c); animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .marque { text-align: center; margin-top: 34px; font-size: 12px; color: var(--mut); }
  .confetti { position: fixed; top: -10px; width: 9px; height: 14px; border-radius: 2px; z-index: 60; animation: tombe linear forwards; }
  @keyframes tombe { to { transform: translateY(110vh) rotate(720deg); opacity: .2; } }
  @media (max-width: 560px) { main { padding-top: 18px; } .bandeau { height: 110px; } .q { padding: 18px; border-radius: 18px; } .echelle { gap: 5px; } .echelle button { padding: 11px 0; font-size: 14px; } .etoiles svg { width: 34px; height: 34px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="barre" id="barre"></div>
<main id="app"><div class="chargement"><div class="rond"></div></div></main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwfwxfVa2968AgKLdwwV8VIazVACVPVypKXrEUTc-zTuQ08gda8m5_qPfC2BgMyJMwb/exec";
const LOGO = "https://hecg.fr/wp-content/uploads/2025/03/LOGO-FORMAT-PNG-1-1.png";
const id = new URLSearchParams(location.search).get('f') || '';
const t0 = Date.now();
let F = null; const R = {};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ETOILE = '<svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.7-.8z"/></svg>';
async function api(payload) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}
function theme(th) {
  th = th || {};
  document.documentElement.style.setProperty('--c', th.couleur || '#1A4E8A');
  document.documentElement.style.setProperty('--a', th.accent || '#F26522');
  document.body.classList.toggle('sombre', th.fond === 'sombre');
  document.body.classList.toggle('aurore', th.fond === 'aurore');
  document.body.classList.toggle('ronde', th.police === 'ronde');
}
function etat(html) { document.getElementById('app').innerHTML = `<div class="entete"><div class="bandeau"><div class="logo"><img src="${LOGO}" alt="HECG"></div></div><div class="etat">${html}</div></div><p class="marque">HECG — Hautes Études de Comptabilité et de Gestion</p>`; }
async function charger() {
  if (!id) { etat('<h1>Formulaire introuvable</h1><p class="desc">Le lien semble incomplet.</p>'); return; }
  try {
    const r = await api({ action: 'formPublicGet', id });
    if (!r.success) { theme(r.theme); etat(`<h1>${esc(r.titre || 'Formulaire indisponible')}</h1><p class="desc">${esc(r.message)}</p>`); return; }
    F = r.data; theme(F.theme); document.title = F.titre + ' — HECG'; rendre();
  } catch (e) { etat('<h1>Connexion impossible</h1><p class="desc">Vérifiez votre connexion internet puis rechargez la page.</p>'); }
}
function champ(q) {
  const n = 'q_' + q.id;
  switch (q.type) {
    case 'paragraphe': return `<div class="champ"><textarea id="${n}" placeholder="Votre réponse…" oninput="saisie('${q.id}', this.value)"></textarea></div>`;
    case 'email': return `<div class="champ"><input type="email" id="${n}" placeholder="nom@exemple.fr" autocomplete="email" oninput="saisie('${q.id}', this.value)"></div>`;
    case 'tel': return `<div class="champ"><input type="tel" id="${n}" placeholder="06 00 00 00 00" autocomplete="tel" oninput="saisie('${q.id}', this.value)"></div>`;
    case 'nombre': return `<div class="champ"><input type="number" id="${n}" oninput="saisie('${q.id}', this.value)"></div>`;
    case 'date': return `<div class="champ"><input type="date" id="${n}" oninput="saisie('${q.id}', this.value)"></div>`;
    case 'liste': return `<div class="champ"><select id="${n}" onchange="saisie('${q.id}', this.value)"><option value="">Choisir…</option>${(q.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select></div>`;
    case 'choix': case 'cases': {
      const multi = q.type === 'cases';
      return `<div class="puces">${(q.options || []).map((o, i) => `<div class="puce ${multi ? 'carre' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="${n}" id="${n}_${i}" value="${esc(o)}" onchange="coche('${q.id}', ${multi})"><label for="${n}_${i}">${esc(o)}</label></div>`).join('')}</div>`;
    }
    case 'etoiles': return `<div class="etoiles" data-q="${q.id}">${[1, 2, 3, 4, 5].map(v => `<button type="button" aria-label="${v} sur 5" onclick="note('${q.id}', ${v}, this)">${ETOILE}</button>`).join('')}<span class="val"></span></div>`;
    case 'echelle': case 'nps': {
      const min = q.type === 'nps' ? 0 : (q.min ?? 1), max = q.type === 'nps' ? 10 : (q.max || 5), b = [];
      for (let v = min; v <= max; v++) b.push(`<button type="button" onclick="echelle('${q.id}', ${v}, this, ${q.type === 'nps'})">${v}</button>`);
      const gauche = q.type === 'nps' ? 'Pas du tout probable' : (q.minLabel || ''), droite = q.type === 'nps' ? 'Très probable' : (q.maxLabel || '');
      return `<div class="echelle ${q.type === 'nps' ? 'nps' : ''}">${b.join('')}</div>${gauche || droite ? `<div class="bornes"><span>${esc(gauche)}</span><span>${esc(droite)}</span></div>` : ''}`;
    }
    case 'oui_non': return `<div class="ouinon"><button type="button" class="oui" onclick="ouinon('${q.id}', 'Oui', this)">👍 Oui</button><button type="button" class="non" onclick="ouinon('${q.id}', 'Non', this)">Non</button></div>`;
    default: return `<div class="champ"><input type="text" id="${n}" placeholder="Votre réponse…" oninput="saisie('${q.id}', this.value)"></div>`;
  }
}
function rendre() {
  const qs = F.questions || [], nbQ = qs.filter(q => q.type !== 'section').length;
  const duree = Math.max(1, Math.round(nbQ * 0.4));
  let h = `<div class="entete"><div class="bandeau" ${F.theme && F.theme.image ? `style="background-image:linear-gradient(120deg,color-mix(in srgb,var(--c) 70%,transparent),color-mix(in srgb,var(--a) 50%,transparent)),url('${esc(F.theme.image)}')"` : ''}><div class="logo"><img src="${LOGO}" alt="HECG"></div></div>
    <div class="intro"><h1>${esc(F.titre)}</h1>${F.description ? `<p class="desc">${esc(F.description)}</p>` : ''}
    <div class="meta"><span>⏱ ${duree} min environ</span><span>📝 ${nbQ} question${nbQ > 1 ? 's' : ''}</span>${qs.some(q => q.obligatoire) ? '<span><b style="color:var(--a)">*</b> obligatoire</span>' : ''}</div></div></div>
    <form id="form" onsubmit="envoyer(event)" novalidate><input class="hp" name="site" id="hp" tabindex="-1" autocomplete="off">`;
  qs.forEach((q, i) => {
    if (q.type === 'section') { h += `<div class="section-titre">${esc(q.label)}</div>`; return; }
    h += `<div class="q" id="bloc_${q.id}" style="animation-delay:${Math.min(i, 8) * 45}ms"><div class="lib">${esc(q.label)}${q.obligatoire ? '<span class="obl">*</span>' : ''}</div>
      ${q.aide ? `<div class="aide">${esc(q.aide)}</div>` : ''}${champ(q)}<div class="msgerr">Cette question est obligatoire.</div></div>`;
  });
  h += `<div class="pied"><button class="envoyer" id="btnEnvoyer">Envoyer mes réponses</button><p class="note">🔒 Vos réponses sont transmises de façon sécurisée à l'équipe HECG.</p></div></form><p class="marque">HECG — Hautes Études de Comptabilité et de Gestion</p>`;
  document.getElementById('app').innerHTML = h;
  progression();
}
function progression() {
  const qs = (F.questions || []).filter(q => q.type !== 'section');
  const faits = qs.filter(q => { const v = R[q.id]; return !(v === undefined || v === '' || (Array.isArray(v) && !v.length)); }).length;
  document.getElementById('barre').style.width = (qs.length ? faits / qs.length * 100 : 0) + '%';
}
function ok(qid) { const b = document.getElementById('bloc_' + qid); if (b) b.classList.remove('erreur'); progression(); }
function saisie(qid, v) { R[qid] = v.trim(); ok(qid); }
function coche(qid, multi) {
  const els = [...document.querySelectorAll(`[name="q_${qid}"]`)].filter(x => x.checked).map(x => x.value);
  R[qid] = multi ? els : (els[0] || ''); ok(qid);
}
function note(qid, v, btn) {
  R[qid] = v;
  const box = btn.parentElement;
  [...box.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('on', i < v));
  box.querySelector('.val').textContent = ['', 'Insuffisant', 'Passable', 'Correct', 'Bien', 'Excellent'][v];
  ok(qid);
}
function echelle(qid, v, btn, nps) {
  R[qid] = v;
  [...btn.parentElement.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b === btn));
  if (nps) btn.parentElement.style.setProperty('--teinte', v <= 6 ? '#ef4444' : v <= 8 ? '#f59e0b' : '#10b981');
  ok(qid);
}
function ouinon(qid, v, btn) { R[qid] = v; [...btn.parentElement.querySelectorAll('button')].forEach(b => b.classList.toggle('on', b === btn)); ok(qid); }
async function envoyer(ev) {
  ev.preventDefault();
  let premier = null;
  (F.questions || []).forEach(q => {
    if (q.type === 'section') return;
    const v = R[q.id], vide = v === undefined || v === '' || (Array.isArray(v) && !v.length);
    let bad = q.obligatoire && vide;
    if (!vide && q.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) bad = true;
    const b = document.getElementById('bloc_' + q.id);
    if (b) b.classList.toggle('erreur', bad);
    if (bad && !premier) premier = b;
  });
  if (premier) { premier.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const btn = document.getElementById('btnEnvoyer'); btn.disabled = true; btn.textContent = 'Envoi en cours…';
  try {
    const r = await api({ action: 'formPublicSubmit', id, reponses: JSON.stringify(R), hp: document.getElementById('hp').value, duree: Math.round((Date.now() - t0) / 1000) });
    if (!r.success) throw new Error(r.message || 'Envoi impossible');
    document.getElementById('barre').style.width = '100%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    etat(`<div class="coche"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><h1>Merci !</h1><p class="desc">${esc(r.messageFin)}</p>`);
    confettis();
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = 'Envoyer mes réponses'; }
}
function confettis() {
  const couleurs = [getComputedStyle(document.documentElement).getPropertyValue('--c'), getComputedStyle(document.documentElement).getPropertyValue('--a'), '#fbbf24', '#10b981', '#8b5cf6'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = couleurs[i % couleurs.length];
    c.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5200);
  }
}
charger();
</script>
</body>
</html>
