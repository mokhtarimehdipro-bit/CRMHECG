<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Fiche Partenaire - HECG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">
    <main class="max-w-6xl mx-auto p-8">
        <div id="loader" class="text-center py-20 font-black text-[#1A4E8A] animate-pulse">Analyse du partenaire en cours...</div>
        
        <div id="content" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-1">
                            <h1 id="entNom" class="text-4xl font-black text-[#1A4E8A]">Entreprise</h1>
                            <button onclick="editEntrepriseName()" class="text-gray-400 hover:text-[#1A4E8A] text-lg" title="Renommer l'entreprise">✏️</button>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <p id="entAdresse" class="text-sm text-gray-400 font-medium"></p>
                            <button onclick="editAdresse()" class="text-gray-300 hover:text-[#1A4E8A] text-xs" title="Modifier l'adresse">✏️</button>
                        </div>
                    </div>
                    <button onclick="window.close()" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl font-bold hover:bg-gray-200">Fermer la fiche</button>
                </div>
                <div id="contactsList" class="space-y-2"></div>
                <button onclick="toggleAddContactForm()" class="mt-3 text-sm font-bold text-[#1A4E8A] hover:underline">+ Ajouter un contact</button>
                <div id="addContactForm" class="hidden mt-3 p-4 bg-gray-50 rounded-2xl border border-gray-200 space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text"  id="newNom"    placeholder="Nom"           class="border p-2 rounded-lg text-sm bg-white">
                        <input type="text"  id="newPrenom" placeholder="Prénom"         class="border p-2 rounded-lg text-sm bg-white">
                        <input type="email" id="newMail"   placeholder="Email 1"        class="border p-2 rounded-lg text-sm bg-white">
                        <input type="email" id="newMail2"  placeholder="Email 2"        class="border p-2 rounded-lg text-sm bg-white">
                        <input type="text"  id="newTel"    placeholder="Téléphone 1"    class="border p-2 rounded-lg text-sm bg-white">
                        <input type="text"  id="newTel2"   placeholder="Téléphone 2"    class="border p-2 rounded-lg text-sm bg-white">
                    </div>
                    <button onclick="addContact()" class="w-full bg-[#1A4E8A] text-white py-2 rounded-xl font-black text-sm hover:bg-blue-800">Enregistrer le contact</button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-orange-100">
                        <h3 class="font-black text-orange-600 mb-4 flex items-center gap-2"><span>🔔</span> Programmer une alerte</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-400">Date du 1er rappel</label>
                                <input type="date" id="alertDate" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-400">Répétition (Infini)</label>
                                <select id="alertFreq" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                                    <option value="Unique">Une seule fois</option>
                                    <option value="Hebdomadaire">Hebdomadaire</option>
                                    <option value="Mensuelle">Mensuelle</option>
                                    <option value="Trimestrielle">Trimestrielle</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-400">Email du destinataire</label>
                                <input type="email" id="alertDest" value="m.mokhtari@hecg.fr" class="w-full border p-2 rounded-lg text-sm bg-gray-50 font-bold text-[#1A4E8A]">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-400">Message envoyé par mail</label>
                                <textarea id="alertMsg" placeholder="Rappeler le DRH..." class="w-full border p-2 rounded-lg text-xs bg-gray-50 custom-scrollbar"></textarea>
                            </div>
                            <button onclick="saveAlert()" class="w-full bg-orange-500 text-white py-3 rounded-xl font-black text-sm hover:bg-orange-600 transition shadow-md">Activer l'alerte</button>
                        </div>
                        <div id="alertesList" class="mt-4 space-y-2 border-t pt-4"></div>
                    </div>

                    <div class="bg-gradient-to-br from-[#1A4E8A] to-[#002a5c] p-6 rounded-3xl shadow-lg text-white">
                        <h3 class="font-black text-blue-100 mb-4 uppercase tracking-wider text-sm">🎓 Alternants en poste</h3>
                        <div id="listEtu" class="text-sm space-y-3"></div>
                    </div>

                    <div id="anciensAlternantsBlock" class="hidden bg-amber-50 p-6 rounded-3xl border border-amber-200">
                        <h3 class="font-black text-amber-700 mb-2 text-sm uppercase tracking-wider">⚠️ Anciens alternants — À confirmer</h3>
                        <p class="text-xs text-amber-600 mb-4">Ces étudiants semblent avoir quitté cette entreprise. Confirmez leur départ ou signalez une erreur de saisie.</p>
                        <div id="anciensAlternantsListDP" class="space-y-3"></div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                        <h3 class="text-xl font-black text-gray-800 mb-6 border-b pb-2">📝 Historique des échanges</h3>
                        <div class="flex space-x-2 mb-6 bg-gray-50 p-2 rounded-xl">
                            <input type="text" id="noteTexte" placeholder="Ex: Eu le DRH au téléphone..." class="flex-1 bg-transparent p-2 outline-none text-sm">
                            <button onclick="addNote()" class="bg-[#1A4E8A] text-white px-6 py-2 rounded-lg font-black text-sm">Ajouter</button>
                        </div>
                        <div id="suiviTimeline" class="space-y-4 max-h-64 overflow-y-auto pr-4 custom-scrollbar"></div>
                    </div>

                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                        <div class="flex justify-between items-center mb-6 border-b pb-2">
                            <h3 class="text-xl font-black text-gray-800">💼 Offres d'alternance</h3>
                            <button onclick="ajouterOffreRapide()" class="text-sm bg-green-50 text-green-600 font-bold px-4 py-2 rounded-lg hover:bg-green-100 transition">+ Nouvelle Offre</button>
                        </div>
                        <div id="listOffres" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwfwxfVa2968AgKLdwwV8VIazVACVPVypKXrEUTc-zTuQ08gda8m5_qPfC2BgMyJMwb/exec";
        
        async function apiPost(payload) {
            const userSession = JSON.parse(localStorage.getItem('user') || '{}');
            
            // On prépare les étiquettes pour le script Google
            payload.idAuteur = userSession.nom || "Inconnu";    // Pour l'onglet HISTORIQUE
            payload.auteur = userSession.nom || "Inconnu";      // Pour l'onglet SUIVI_PARTENARIAT
            payload.roleAuteur = userSession.role || "N/A";     // Pour le filtrage des droits
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (e) {
                console.error("Erreur API :", e);
                return { success: false, message: "Erreur de connexion" };
            }
        }
        

        const partId = new URLSearchParams(window.location.search).get('id');
        let currentUser = null;
        let nomEntrepriseActuelle = "";
        let contactsData = [];
        let adresseData = { adresse: "", cp: "", ville: "" };

        try { currentUser = JSON.parse(localStorage.getItem('user')); } catch(e) {}
        if(!currentUser) currentUser = { nom: "Utilisateur" };

        async function loadDetails() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getPartnerDetails', targetId: partId }) });
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                    const d = data.data;
                    
                    nomEntrepriseActuelle = d.info.entreprise;
                    document.getElementById('entNom').innerText = d.info.entreprise;
                    adresseData = { adresse: d.info.adresse || "", cp: d.info.cp || "", ville: d.info.ville || "" };
                    const adresseDisplay = [d.info.adresse, d.info.cp, d.info.ville].filter(Boolean).join(' · ');
                    document.getElementById('entAdresse').innerText = adresseDisplay || 'Adresse non renseignée';

                    // Stockage global + rendu contacts
                    contactsData = d.contacts || [];
                    renderContacts();

                    // Alternants
                    const alt = d.alternants || [];
                    document.getElementById('listEtu').innerHTML = alt.length === 0
                        ? '<p class="text-blue-200 italic text-center py-4">Aucun alternant HECG actuellement.</p>'
                        : alt.map(e => '<div class="bg-white/10 p-3 rounded-xl border border-white/20"><p class="font-bold text-lg leading-tight">' + e.nom + '</p><p class="text-[10px] text-blue-200 uppercase mt-1 font-black tracking-widest">' + e.classe + '</p></div>').join('');

                    // Anciens alternants
                    const anc = d.anciensAlternants || [];
                    const ancBlock = document.getElementById('anciensAlternantsBlock');
                    if (anc.length > 0) {
                        ancBlock.classList.remove('hidden');
                        document.getElementById('anciensAlternantsListDP').innerHTML = anc.map(a => {
                            const dateStr = a.date ? new Date(a.date).toLocaleDateString('fr-FR') : '?';
                            const isPending = a.status === 'À_confirmer';
                            return '<div class="bg-white p-3 rounded-xl border border-amber-200 space-y-2">'
                                + '<div class="flex justify-between items-start gap-2">'
                                + '<div><p class="font-bold text-gray-800 text-sm">' + (a.prenom||'') + ' ' + (a.nom||'') + '</p>'
                                + '<p class="text-[10px] text-gray-400 uppercase font-bold mt-0.5">Détecté le ' + dateStr + '</p></div>'
                                + '<span class="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-black ' + (isPending ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700') + '">' + (isPending ? 'À confirmer' : a.status) + '</span>'
                                + '</div>'
                                + (isPending ? '<div class="flex gap-2">'
                                + '<button onclick="confirmFormerAlternant(\'' + a.id + '\')" class="flex-1 text-xs bg-green-100 text-green-700 font-bold py-1.5 rounded-lg hover:bg-green-200 transition">✓ Confirmer le départ</button>'
                                + '<button onclick="removeFormerAlternant(\'' + a.id + '\')" class="flex-1 text-xs bg-red-100 text-red-600 font-bold py-1.5 rounded-lg hover:bg-red-200 transition">✗ Erreur de saisie</button>'
                                + '</div>' : '')
                                + '</div>';
                        }).join('');
                    } else {
                        ancBlock.classList.add('hidden');
                    }

                    // Offres
                    const offres = d.offres || [];
                    document.getElementById('listOffres').innerHTML = offres.length === 0
                        ? '<p class="col-span-2 text-gray-400 italic text-center py-6">Aucune offre associée.</p>'
                        : offres.map(o => '<div class="p-4 border border-gray-100 rounded-2xl bg-gray-50 hover:shadow-md transition"><div class="flex justify-between items-start mb-2"><span class="px-2 py-1 bg-blue-100 text-blue-700 text-[10px] font-black rounded uppercase">' + (o.etat||'-') + '</span></div><p class="font-black text-gray-800 text-sm mb-3">' + (o.poste||'-') + '</p><a href="' + (o.url||'#') + '" target="_blank" class="text-[#F26522] text-xs font-bold hover:underline">Voir l\'annonce ↗</a></div>').join('');

                    // Suivi
                    const suivi = d.suivi || [];
                    document.getElementById('suiviTimeline').innerHTML = suivi.length === 0
                        ? '<p class="text-gray-400 italic text-center">Aucun échange enregistré.</p>'
                        : suivi.map(s => '<div class="bg-gray-50 p-4 rounded-xl border-l-4 border-[#1A4E8A]"><p class="text-[10px] text-gray-400 font-bold uppercase mb-1">' + new Date(s.date).toLocaleDateString('fr-FR') + ' — Par ' + (s.auteur||'') + '</p><p class="text-sm text-gray-700">' + (s.texte||'') + '</p></div>').join('');

                    // Alertes programmées
                    const alertes = (d.alertes || []).filter(a => a.statut === 'Actif' || a.statut === 'À faire');
                    document.getElementById('alertesList').innerHTML = alertes.map(a => '<div class="bg-orange-50 p-2 rounded text-[10px] border border-orange-200"><b class="text-orange-800">Prévue le ' + new Date(a.date).toLocaleDateString() + ' (' + a.freq + ')</b><br><span class="text-orange-600 truncate block">' + a.msg + '</span></div>').join('');
                }
            } catch(e) {
                console.error("Erreur chargement dossier partenaire:", e);
                document.getElementById('loader').innerText = "Erreur de chargement : " + e.message;
            }
        }

        async function addNote() {
    const txt = document.getElementById('noteTexte').value;
    if(!txt.trim()) return;
    
    const btn = event.target;
    btn.disabled = true; btn.innerText = "⏳";

    // ON ENVOIE LES ÉTIQUETTES QUE LE SERVEUR ATTEND
    await apiPost({ 
        action: 'addPartnerNote', 
        targetId: partId,    // Va dans 'ID_Partenaire'
        texte: txt           // Va dans 'Compte_rendu'
    });

    document.getElementById('noteTexte').value = ""; 
    btn.disabled = false; btn.innerText = "Ajouter";
    
    // On attend un peu que le Sheet s'actualise avant de recharger l'affichage
    setTimeout(loadDetails, 3000);
}

        async function saveAlert() {
            const date = document.getElementById('alertDate').value;
            const msg = document.getElementById('alertMsg').value;
            const destinataire = document.getElementById('alertDest').value;
            
            if(!date || !msg) return alert("Veuillez remplir la date et le message.");
            
            const btn = event.target; 
            btn.innerText = "Enregistrement..."; btn.disabled = true;

            await apiPost({ 
                action: 'setPartnerAlert', 
                targetId: partId, 
                date: date, 
                freq: document.getElementById('alertFreq').value, 
                msg: msg,
                destinataire: destinataire 
            });
            
            alert("Alerte programmée !"); 
            btn.innerText = "Activer l'alerte"; btn.disabled = false;
            loadDetails();
        }

        function renderContacts() {
            const el = document.getElementById('contactsList');
            if (!contactsData || contactsData.length === 0) {
                el.innerHTML = '<p class="text-sm text-gray-400 italic">Aucun contact enregistré.</p>';
                return;
            }
            el.innerHTML = contactsData.map((c, idx) => {
                const nom = c.nom || '';
                const prenom = c.prenom || '';

                const mails = [c.mail, c.mail2].filter(m => m && m.trim());
                const tels  = [c.tel,  c.tel2 ].filter(t => t && t.trim());

                const mailsHtml = mails.map(m => '<a href="mailto:' + m + '" class="text-blue-500 hover:underline">' + m + '</a>').join(' &nbsp;·&nbsp; ');
                const telsHtml  = tels.map(t => '<span>' + t + '</span>').join(' &nbsp;·&nbsp; ');

                return '<div class="flex items-start justify-between gap-3 p-3 bg-gray-50 rounded-xl border border-gray-100">'
                    + '<div class="text-sm space-y-0.5">'
                    + '<p class="font-bold text-gray-800">👤 ' + prenom + ' ' + nom + '</p>'
                    + (mailsHtml ? '<p class="text-xs text-gray-500">✉️ ' + mailsHtml + '</p>' : '')
                    + (telsHtml  ? '<p class="text-xs text-gray-500">📞 ' + telsHtml  + '</p>' : '')
                    + '</div>'
                    + '<div class="flex gap-1 shrink-0">'
                    + '<button data-idx="' + idx + '" data-action="edit" class="text-xs text-gray-400 hover:text-blue-500 p-1 rounded hover:bg-blue-50" title="Modifier">✏️</button>'
                    + '<button data-idx="' + idx + '" data-action="delete" class="text-xs text-gray-400 hover:text-red-500 p-1 rounded hover:bg-red-50" title="Supprimer">🗑️</button>'
                    + '</div></div>';
            }).join('');
        }

        // Délégation d'événements — évite les problèmes d'echappement dans onclick
        document.addEventListener('click', async function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const idx = parseInt(btn.dataset.idx, 10);
            const c = contactsData[idx];
            if (!c) return;
            if (btn.dataset.action === 'edit') {
                const newNom    = prompt('Nom :',         c.nom    || ''); if (newNom    === null) return;
                const newPrenom = prompt('Prénom :',      c.prenom || ''); if (newPrenom === null) return;
                const newMail   = prompt('Email 1 :',     c.mail   || ''); if (newMail   === null) return;
                const newMail2  = prompt('Email 2 :',     c.mail2  || ''); if (newMail2  === null) return;
                const newTel    = prompt('Téléphone 1 :', c.tel    || ''); if (newTel    === null) return;
                const newTel2   = prompt('Téléphone 2 :', c.tel2   || ''); if (newTel2   === null) return;
                const res = await apiPost({ action: 'updateContact', id_contact: c.id_contact, nom: newNom, prenom: newPrenom, mail: newMail, mail2: newMail2, tel: newTel, tel2: newTel2 });
                if (res.success) loadDetails(); else alert('Erreur : ' + res.message);
            } else if (btn.dataset.action === 'delete') {
                if (!confirm('Supprimer ' + (c.prenom || '') + ' ' + (c.nom || '') + ' ?')) return;
                const res = await apiPost({ action: 'deleteContact', id_contact: c.id_contact });
                if (res.success) loadDetails(); else alert('Erreur : ' + res.message);
            }
        });

        function toggleAddContactForm() {
            const f = document.getElementById('addContactForm');
            f.classList.toggle('hidden');
        }

        async function addContact() {
            const nom = document.getElementById('newNom').value.trim();
            const prenom = document.getElementById('newPrenom').value.trim();
            const mail = document.getElementById('newMail').value.trim();
            const tel = document.getElementById('newTel').value.trim();
            if (!nom && !prenom) return alert("Veuillez saisir au moins un nom.");
            const res = await apiPost({
                action: 'addPartner',
                id_entreprise: partId,
                nom_entreprise: nomEntrepriseActuelle,
                nom, prenom,
                mail1: mail, mail2: document.getElementById('newMail2').value.trim(),
                tel1: tel,   tel2:  document.getElementById('newTel2').value.trim()
            });
            if (res.success) {
                document.getElementById('newNom').value = '';
                document.getElementById('newPrenom').value = '';
                document.getElementById('newMail').value = '';
                document.getElementById('newMail2').value = '';
                document.getElementById('newTel').value = '';
                document.getElementById('newTel2').value = '';
                document.getElementById('addContactForm').classList.add('hidden');
                loadDetails();
            } else {
                alert("Erreur : " + res.message);
            }
        }

        async function editEntrepriseName() {
            const current = document.getElementById('entNom').innerText;
            const newName = prompt("Nouveau nom de l'entreprise :", current);
            if (!newName || newName === current) return;
            const res = await apiPost({ action: 'updateEnterprise', id_entreprise: partId, nouveauNom: newName });
            if (res.success) { nomEntrepriseActuelle = newName; loadDetails(); }
            else alert("Erreur : " + res.message);
        }

        async function editAdresse() {
            const newAdresse = prompt("Adresse (rue, n°...) :", adresseData.adresse); if (newAdresse === null) return;
            const newCp = prompt("Code postal :", adresseData.cp); if (newCp === null) return;
            const newVille = prompt("Ville :", adresseData.ville); if (newVille === null) return;
            const res = await apiPost({ action: 'updateEnterprise', id_entreprise: partId, adresse: newAdresse, cp: newCp, ville: newVille });
            if (res.success) loadDetails(); else alert("Erreur : " + res.message);
        }

        async function confirmFormerAlternant(id) {
            const btn = event.target;
            btn.disabled = true; btn.innerText = "⏳";
            const res = await apiPost({ action: 'confirmFormerAlternant', id });
            if (res.success) loadDetails();
            else { alert("Erreur : " + res.message); btn.disabled = false; btn.innerText = "✓ Confirmer le départ"; }
        }

        async function removeFormerAlternant(id) {
            if (!confirm("Marquer cet enregistrement comme erreur de saisie ?")) return;
            const btn = event.target;
            btn.disabled = true; btn.innerText = "⏳";
            const res = await apiPost({ action: 'removeFormerAlternant', id });
            if (res.success) loadDetails();
            else { alert("Erreur : " + res.message); btn.disabled = false; btn.innerText = "✗ Erreur de saisie"; }
        }

        async function ajouterOffreRapide() {
            const url = prompt("Lien de l'offre :");
            if(!url) return;
            const poste = prompt("Titre du poste :");
            if(!poste) return;
            await apiPost({ action: 'addOffre', url: url, entreprise: nomEntrepriseActuelle, poste: poste, plateforme: "Direct Partenaire", type: "Alternance", missions: "À définir", etat: "Reçue", qualite: "Vérifiée" });
            loadDetails();
        }
        
        loadDetails();
    </script>
<script>(function(){var SIX_H=6*60*60*1000;function touch(){localStorage.setItem('_lastAct',Date.now());}function check(){var t=parseInt(localStorage.getItem('_lastAct')||'0',10);if(t&&Date.now()-t>SIX_H){localStorage.clear();window.location.href='index.html';}}touch();['click','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});setInterval(check,60000);})();</script>
    <style>.custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }</style>
</body>
</html>
