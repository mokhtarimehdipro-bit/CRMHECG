<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HECG - Tâches de l'équipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{--b:#1A4E8A;--b6:#164378;--b1:#e8eff8;--b0:#f3f7fc;--o:#F26522;--ink:#0e1a2b;--tx:#3b4859;--mu:#7d8a9c;--li:#e7ecf3;--li2:#f1f4f8;--ok:#16a34a;--red:#e5484d}
  .tk{font-family:'Plus Jakarta Sans',Inter,ui-sans-serif,system-ui,sans-serif;color:var(--tx);font-size:13.5px}
  .tk svg{display:inline-block;vertical-align:-2px;flex-shrink:0}
  .tk-crumb{font-size:12.5px;color:var(--mu);font-weight:500;display:flex;align-items:center;gap:6px}
  .tk-h1{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.025em;margin:2px 0 0}
  .tk-btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--li);background:#fff;color:var(--tx);font:600 13px 'Plus Jakarta Sans',Inter,sans-serif;cursor:pointer;transition:all .18s;white-space:nowrap;box-shadow:0 1px 2px rgba(14,26,43,.04)}
  .tk-btn:hover{border-color:#cdd8e6;color:var(--b);box-shadow:0 6px 16px -10px rgba(14,26,43,.35);transform:translateY(-1px)}
  .tk-btn:active{transform:translateY(0) scale(.98)}
  .tk-btn.dark{background:linear-gradient(180deg,#24589a,#1A4E8A);border-color:#164378;color:#fff;box-shadow:0 8px 18px -10px rgba(26,78,138,.9),inset 0 1px 0 rgba(255,255,255,.15)}
  .tk-btn.dark:hover{background:#164378;color:#fff}
  .tk-btn.ora{background:linear-gradient(180deg,#f47637,#F26522);border-color:#e85d1c;color:#fff;box-shadow:0 8px 18px -10px rgba(242,101,34,.9)}
  .tk-btn.ico{width:38px;padding:0;justify-content:center}
  .tk-btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .tk-switch{display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 12px 0 10px;border-radius:11px;border:1px solid var(--li);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(14,26,43,.04)}
  .tk-switch input{display:none}
  .tk-switch .tg{width:34px;height:20px;border-radius:999px;background:#cfd8e4;position:relative;transition:background .2s}
  .tk-switch .tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .tk-switch input:checked+.tg{background:var(--ok)}
  .tk-switch input:checked+.tg::after{transform:translateX(14px)}

  .tk-tabs{display:flex;gap:4px;border-bottom:1px solid var(--li);overflow-x:auto;scrollbar-width:none}
  .tk-tab{position:relative;display:inline-flex;align-items:center;gap:8px;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap;border:none;background:none;transition:color .15s}
  .tk-tab:hover{color:var(--ink)}
  .tk-tab.on{color:var(--ink)}
  .tk-tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2.5px;border-radius:3px;background:var(--b)}
  .tk-tab .n{font-size:11px;font-weight:700;background:var(--li2);color:var(--mu);border-radius:999px;padding:1px 7px}
  .tk-tab.on .n{background:var(--b);color:#fff}
  .tk-tab .av{width:22px;height:22px;font-size:9.5px}

  .tk-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tk-search{position:relative}
  .tk-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}
  .tk-search input,.tk-sel{height:34px;border:1px solid var(--li);border-radius:10px;background:#fff;font:500 13px 'Plus Jakarta Sans',Inter,sans-serif;color:var(--ink);outline:none}
  .tk-search input{width:230px;padding:0 12px 0 33px}
  .tk-sel{padding:0 30px 0 10px}
  .tk-search input:focus,.tk-sel:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(26,78,138,.1)}
  .tk-chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer;user-select:none}
  .tk-chk input{accent-color:var(--b);width:15px;height:15px}

  .tk-card{background:#fff;border:1px solid var(--li);border-radius:18px;box-shadow:0 1px 2px rgba(14,26,43,.03),0 18px 40px -30px rgba(14,26,43,.35);overflow:hidden}
  .tk-zone{border-top:1px solid var(--li2)}
  .tk-zone:first-child{border-top:none}
  .tk-zh{display:flex;align-items:center;gap:10px;padding:16px 20px 10px;cursor:pointer;user-select:none}
  .tk-zh .chev{color:var(--mu);transition:transform .2s}
  .tk-zh.closed .chev{transform:rotate(-90deg)}
  .tk-zh b{font-size:14.5px;font-weight:700;color:var(--ink)}
  .tk-zh .n{font-size:12px;font-weight:600;color:var(--mu)}
  .tk-zh .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tk-grid{display:grid;grid-template-columns:52px minmax(240px,2.2fr) 170px 118px 62px 158px minmax(170px,1.2fr) minmax(150px,1fr);align-items:center}
  .tk-head{padding:0 8px;height:34px;font-size:11.5px;font-weight:600;color:var(--mu);border-bottom:1px solid var(--li2)}
  .tk-head>div{padding:0 8px}
  .tk-row{position:relative;padding:0 8px;min-height:52px;border-bottom:1px solid var(--li2);transition:background .15s}
  .tk-row:hover{background:#f8fafd}
  .tk-row>div{padding:8px 8px;min-width:0}
  .tk-row.urg{background:linear-gradient(90deg,#fff1f1,#fff8f8 60%,#fff)}
  .tk-row.urg::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
  .tk-row.done .tt{color:#9aa6b6;text-decoration:line-through;text-decoration-color:#c3ccd8}
  .tk-row.flash{animation:tkFlash 1s}
  @keyframes tkFlash{0%{background:#e8f6ee}100%{background:transparent}}
  .tk-check{width:24px;height:24px;border-radius:50%;border:1.8px solid #c3ccd8;background:#fff;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;transition:all .18s;margin-left:6px}
  .tk-check:hover{border-color:var(--ok);color:#9fd8b3}
  .tk-check.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 14px -6px rgba(22,163,74,.8);transform:scale(1.04)}
  .tk-check.ro{cursor:default}
  .tt{font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .tt:hover{color:var(--b)}
  .td{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .tk-cell{cursor:pointer;border-radius:8px;transition:background .15s}
  .tk-edit:hover{background:var(--li2)}
  .tk-who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink)}
  .tk-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
  .tk-date{font-size:13px;font-weight:500;color:var(--ink);font-feature-settings:'tnum'}
  .tk-date.late{color:var(--red);font-weight:700}
  .tk-date.today{color:var(--o);font-weight:700}
  .tk-date.none{color:#c3ccd8}
  .tk-flag{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#c3ccd8;cursor:pointer;transition:all .18s;border:1px solid transparent}
  .tk-flag:hover{color:var(--red);background:#fff1f1}
  .tk-flag.on{color:#fff;background:var(--red);box-shadow:0 6px 14px -6px rgba(229,72,77,.9)}
  .tk-flag.ro{cursor:default}
  .tk-cat{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk-cat i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .tk-mandat{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 10px;border-radius:8px;background:#f2f4f8;border:1px solid #e6ebf2;font-size:12px;font-weight:600;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk-mandat .ty{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
  .tk-ph{font-size:12.5px;color:#c3ccd8;font-weight:500}
  .tk-com{font-size:12.5px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .tk-inline{width:100%;height:32px;border:1px solid var(--b);border-radius:8px;padding:0 9px;font:500 13px 'Plus Jakarta Sans',Inter,sans-serif;outline:none;box-shadow:0 0 0 4px rgba(26,78,138,.1)}
  .tk-add{display:flex;align-items:center;gap:10px;padding:12px 24px;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer;transition:color .15s}
  .tk-add:hover{color:var(--b)}
  .tk-empty{padding:22px 24px;font-size:13px;color:#a3aebd}
  .tk-foot{padding:10px 20px;font-size:12px;color:var(--mu);border-top:1px solid var(--li2);background:#fafbfd}

  .tk-pop{position:fixed;z-index:120;min-width:240px;max-width:360px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--li);border-radius:14px;box-shadow:0 24px 60px -16px rgba(14,26,43,.35);padding:6px;font-family:'Plus Jakarta Sans',Inter,sans-serif;animation:tkIn .14s}
  @keyframes tkIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .tk-pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
  .tk-pop .it:hover,.tk-pop .it.act{background:var(--b0);color:var(--b)}
  .tk-pop .sub{font-size:11.5px;color:var(--mu);margin-left:auto;padding-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .tk-pop .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3aebd;padding:8px 10px 4px}
  .tk-pop input{width:100%;height:36px;border:1px solid var(--li);border-radius:9px;padding:0 10px;font:500 13px 'Plus Jakarta Sans',Inter,sans-serif;outline:none;margin-bottom:4px}
  .tk-pop input:focus{border-color:var(--b)}
  .mty{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--li2);color:var(--mu);flex-shrink:0;width:72px;text-align:center}

  .tk-modal{position:fixed;inset:0;z-index:110;background:rgba(14,26,43,.42);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px}
  .tk-modal .box{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 40px 90px -24px rgba(14,26,43,.5);padding:28px;animation:tkIn .2s}
  .tk-modal h2{margin:0;font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .tk-modal .sub{font-size:13px;color:var(--mu);margin:4px 0 0}
  .tk-fl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:16px 0 7px}
  .tk-in{width:100%;min-height:42px;border:1px solid var(--li);border-radius:11px;padding:10px 12px;font:500 14px 'Plus Jakarta Sans',Inter,sans-serif;color:var(--ink);outline:none;background:#fff;transition:all .15s}
  .tk-in:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(26,78,138,.1)}
  textarea.tk-in{min-height:96px;resize:vertical;line-height:1.5}
  .tk-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .tk-ft{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

  .tk-drawer{position:fixed;top:0;right:0;bottom:0;z-index:105;width:min(560px,100%);background:#fff;box-shadow:-30px 0 80px -30px rgba(14,26,43,.45);display:flex;flex-direction:column;animation:tkSlide .25s cubic-bezier(.2,.7,.2,1)}
  @keyframes tkSlide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
  .tk-drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--li2)}
  .tk-drawer .bd{flex:1;overflow:auto;padding:22px}
  .tk-meta{display:grid;grid-template-columns:130px 1fr;gap:12px 14px;align-items:center;margin-top:18px;font-size:13px}
  .tk-meta dt{color:var(--mu);font-weight:600}
  .tk-notes{margin-top:22px;border-top:1px solid var(--li2);padding-top:16px}
  .tk-note{font-size:12.5px;color:var(--tx);padding:8px 12px;border-radius:10px;background:#f7f9fc;margin-bottom:6px;white-space:pre-line}
  .tk-backdrop{position:fixed;inset:0;z-index:104;background:rgba(14,26,43,.18)}

  .tk-catrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--li);border-radius:12px;margin-bottom:8px;background:#fff}
  .tk-catrow input{flex:1;border:none;outline:none;font:600 13.5px 'Plus Jakarta Sans',Inter,sans-serif;color:var(--ink)}
  .tk-dots{display:flex;gap:5px}
  .tk-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--li);transition:transform .12s}
  .tk-dot:hover{transform:scale(1.15)}
  .tk-dot.on{box-shadow:0 0 0 2px var(--ink)}
  .tk-mini{width:28px;height:28px;border-radius:8px;border:1px solid var(--li);background:#fff;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tk-mini:hover{color:var(--red);border-color:#f3c4c6}

  .tk-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;font:600 13px 'Plus Jakarta Sans',Inter,sans-serif;padding:11px 18px;border-radius:12px;box-shadow:0 18px 40px -12px rgba(14,26,43,.5);animation:tkIn .2s}
  .tk-toast.err{background:var(--red)}
  .tk-skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f7f9fc,#eef2f7);background-size:200% 100%;animation:tkSk 1.2s infinite}
  @keyframes tkSk{to{background-position:-200% 0}}
  @media(max-width:1100px){.tk-grid{grid-template-columns:44px minmax(200px,1fr) 140px 108px 52px 140px}.tk-grid>.c-mandat,.tk-grid>.c-com{display:none}}
  @media(max-width:720px){.tk-grid{grid-template-columns:44px 1fr 100px 46px}.tk-grid>.c-who,.tk-grid>.c-cat{display:none}.tk-search input{width:150px}}

  /* ═════ v2 : plus aéré, dégradés & ombres douces (nov. 2026) ═════ */
  body.tk-page{background:radial-gradient(1200px 520px at 105% -12%,rgba(26,78,138,.12),transparent 60%),radial-gradient(900px 480px at -8% 108%,rgba(242,101,34,.08),transparent 62%),linear-gradient(180deg,#f2f5fa,#eef2f8) !important;background-attachment:fixed !important}
  .tk-hero{position:relative;border-radius:26px;padding:30px 34px 0;margin-bottom:26px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(243,247,252,.86));border:1px solid rgba(220,229,241,.9);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -40px rgba(26,78,138,.45);backdrop-filter:blur(10px);overflow:hidden}
  .tk-hero::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#1A4E8A,#3f7cc4 45%,#F26522)}
  .tk-hero::after{content:'';position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(26,78,138,.10),transparent 70%);pointer-events:none}
  .tk-h1{font-size:30px}
  .tk-crumb{font-size:13px}
  .tk-btn{height:42px;padding:0 18px;border-radius:13px;background:linear-gradient(180deg,#ffffff,#f3f6fb);border-color:#dfe6f0;box-shadow:0 1px 0 #fff inset,0 6px 14px -10px rgba(14,26,43,.35)}
  .tk-btn:hover{background:linear-gradient(180deg,#ffffff,#eaf0f8);box-shadow:0 1px 0 #fff inset,0 14px 24px -14px rgba(26,78,138,.5)}
  .tk-btn.ico{width:42px}
  .tk-btn.dark{background:linear-gradient(180deg,#2d64a8,#1A4E8A 60%,#163f73);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 14px 26px -12px rgba(26,78,138,.85)}
  .tk-btn.dark:hover{background:linear-gradient(180deg,#336db3,#1d5596 60%,#164378)}
  .tk-switch{height:42px;padding:0 14px 0 12px;border-radius:13px;background:linear-gradient(180deg,#fff,#f3f6fb);border-color:#dfe6f0;box-shadow:0 6px 14px -10px rgba(14,26,43,.35)}
  .tk-tabs{border-bottom:none;gap:8px;padding:22px 0 20px;margin-top:6px}
  .tk-tab{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid #e3e9f2;font-size:13.5px;transition:all .18s}
  .tk-tab:hover{background:#fff;box-shadow:0 8px 18px -14px rgba(14,26,43,.45)}
  .tk-tab.on{background:linear-gradient(135deg,#24589a,#1A4E8A);border-color:#1A4E8A;color:#fff;box-shadow:0 12px 22px -12px rgba(26,78,138,.8)}
  .tk-tab.on::after{display:none}
  .tk-tab.on .n{background:rgba(255,255,255,.22);color:#fff}
  .tk-tools{gap:10px}
  .tk-search input,.tk-sel{height:40px;border-radius:12px;background:linear-gradient(180deg,#fff,#f6f8fc);border-color:#dfe6f0;box-shadow:0 1px 0 #fff inset}
  .tk-search input{width:260px}
  .tk-card{border-radius:24px;border:1px solid rgba(220,229,241,.95);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(247,249,253,.94));box-shadow:0 1px 0 #fff inset,0 34px 70px -46px rgba(14,26,43,.55)}
  .tk-zone+.tk-zone{border-top:1px solid #e9eef5}
  .tk-zh{padding:22px 28px 14px;gap:12px}
  .tk-zh b{font-size:15.5px}
  .tk-zh .n{background:#e9eef6;color:#516178;border-radius:999px;padding:2px 9px;font-size:12px}
  .tk-zone[data-z=A] .tk-zh{background:linear-gradient(90deg,rgba(242,101,34,.07),transparent 55%)}
  .tk-zone[data-z=B] .tk-zh{background:linear-gradient(90deg,rgba(26,78,138,.07),transparent 55%)}
  .tk-zone[data-z=C] .tk-zh{background:linear-gradient(90deg,rgba(22,163,74,.07),transparent 55%)}
  .tk-head{height:40px;padding:0 16px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:#8a96a8;background:rgba(241,245,250,.7)}
  .tk-row{min-height:66px;padding:0 16px;margin:0 10px;border-radius:14px;border-bottom:none;transition:background .18s,box-shadow .18s,transform .18s}
  .tk-row+.tk-row{margin-top:4px}
  .tk-row>div{padding:12px 10px}
  .tk-row:hover{background:linear-gradient(90deg,#f4f8fd,#fafcfe);box-shadow:0 10px 22px -18px rgba(26,78,138,.55)}
  .tk-row.urg{background:linear-gradient(90deg,#ffecec,#fff6f6 55%,#fffafa);box-shadow:0 12px 24px -20px rgba(229,72,77,.7)}
  .tk-row.urg::before{top:10px;bottom:10px;width:4px}
  .tt{font-size:14.5px}
  .td{font-size:12.5px;margin-top:3px}
  .tk-check{width:26px;height:26px;background:linear-gradient(180deg,#fff,#f1f4f8);box-shadow:0 2px 5px -2px rgba(14,26,43,.25)}
  .tk-check.on{background:linear-gradient(180deg,#22c55e,#16a34a)}
  .tk-flag{width:36px;height:36px;border-radius:11px}
  .tk-flag.on{background:linear-gradient(180deg,#f2666b,#e5484d)}
  .tk-cat{padding:5px 12px;font-size:12.5px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
  .tk-mandat{padding:5px 11px;border-radius:10px;background:linear-gradient(180deg,#f7f9fc,#eef2f7);font-size:12.5px}
  .tk-add{padding:16px 30px 20px}
  .tk-empty{padding:26px 30px}
  .tk-foot{padding:14px 28px;background:linear-gradient(180deg,rgba(246,248,252,.6),rgba(240,244,249,.9))}
  .av{width:30px;height:30px;font-size:11px}
  /* fenêtres plus grandes et plus douces */
  .tk-modal .box{max-width:820px;padding:36px 40px;border-radius:28px;background:linear-gradient(180deg,#ffffff,#f6f8fc);border:1px solid #e6ecf4}
  .tk-modal h2{font-size:24px}
  .tk-in{min-height:48px;border-radius:13px;background:linear-gradient(180deg,#fff,#f8fafd);border-color:#dfe6f0;font-size:14.5px}
  textarea.tk-in{min-height:130px}
  .tk-2{gap:0 18px}

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwfwxfVa2968AgKLdwwV8VIazVACVPVypKXrEUTc-zTuQ08gda8m5_qPfC2BgMyJMwb/exec";
// Retente automatiquement en cas d'erreur transitoire Apps Script
(function(){var nf=window.fetch,D=[700,1800];window.fetch=function(i,o){var u=typeof i==='string'?i:(i&&i.url)||'';if(u.indexOf('script.google.com/macros/s/')===-1)return nf(i,o);var a=0;function t(){return nf(i,o).then(function(r){if(!r.ok&&a<D.length){var d=D[a++];return new Promise(function(x){setTimeout(x,d)}).then(t)}return r},function(e){if(a<D.length){var d=D[a++];return new Promise(function(x){setTimeout(x,d)}).then(t)}throw e})}return t()}})();

const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!user || !user.role) window.location.href = 'index.html';
const ME = String(user.email || '').toLowerCase();
const IS_ADMIN = user.role === 'Administrateur' || ME === 'm.mokhtari@hecg.fr';

const ICO = {
  check:'<path d="M20 6 9 17l-5-5"/>', flag:'<path d="M4 22V4"/><path d="M4 4h13l-2.5 4.5L17 13H4"/>', chev:'<path d="m6 9 6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>', mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>', sq:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/>', archive:'<rect x="2" y="4" width="20" height="5" rx="1.5"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>', trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  up:'<path d="m18 15-6-6-6 6"/>', ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>', inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
};
const svg = (k, s = 16, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>`;
const PALETTE = ['#1A4E8A','#F26522','#16a34a','#6d28d9','#0f766e','#b45309','#db2777','#0891b2','#e5484d','#475569'];
const MTYPE = { etudiant:'Étudiant', entreprise:'Entreprise', contact:'Contact', personnel:'Équipe', classe:'Classe', offre:'Offre', autre:'Autre' };

let S = { taches: [], equipe: [], cats: [], params: {}, mandats: [], tab: IS_ADMIN ? 'all' : ME, closed: { C: true }, loaded: false, selMode: false, sel: new Set(), zoneIds: {} };

// ── utilitaires ──────────────────────────────────────────────────────────
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtD = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; };
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(nom, email) { const ini = String(nom||email||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); const h = hue(email||nom); return `<span class="av" style="background:linear-gradient(135deg,hsl(${h},55%,52%),hsl(${(h+30)%360},55%,40%))">${esc(ini)}</span>`; }
function personne(email) { return S.equipe.find(e => e.email === email); }
function nomDe(t) { const p = personne(t.email); return (p && p.nom) || t.collab || t.email; }
function cat(id) { return S.cats.find(c => c.id === id); }
function toast(msg, err) { const t = document.createElement('div'); t.className = 'tk-toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

async function api(payload) {
  payload.idAuteur = user.nom || 'Inconnu'; payload.roleAuteur = user.role || ''; payload.emailAuteur = user.email || ''; payload.sessionToken = user.sessionToken || '';
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  const res = await r.json();
  if (res.sessionExpired) { localStorage.removeItem('user'); alert('Session expirée. Veuillez vous reconnecter.'); location.href = 'index.html'; }
  return res;
}

// ── chargement (cache local + rafraîchissement silencieux) ───────────────
const CK = 'hecg_cache_taches_v1_' + ME;
async function load(fresh) {
  if (!fresh) {
    try { const c = JSON.parse(sessionStorage.getItem(CK) || 'null'); if (c && Date.now() - c.ts < 120000) { Object.assign(S, c.s, { loaded: true }); renderAll(); } } catch (e) {}
  }
  try {
    const [t, r] = await Promise.all([api({ action:'getTaches' }), api({ action:'getTachesRef' })]);
    if (!t.success) { toast('Erreur : ' + t.message, true); if (/inconnue/i.test(t.message)) document.getElementById('board').innerHTML = '<div class="tk-empty">Le serveur n\'est pas encore à jour.</div>'; return; }
    S.taches = t.data || [];
    if (r.success) { S.equipe = r.equipe || []; S.cats = r.categories || []; S.params = r.params || {}; S.mandats = r.mandats || []; }
    S.loaded = true;
    try { sessionStorage.setItem(CK, JSON.stringify({ ts: Date.now(), s: { taches: S.taches, equipe: S.equipe, cats: S.cats, params: S.params } })); } catch (e) {}
    renderAll();
  } catch (e) { console.error(e); toast('Connexion au serveur impossible', true); }
}
setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.tk-pop,.tk-modal,.tk-drawer,.tk-inline')) load(true); }, 90000);

// ── en-tête ───────────────────────────────────────────────────────────────
function renderHead() {
  const h = document.getElementById('headActions');
  let html = '';
  if (IS_ADMIN) {
    const on = S.params.notifMail !== 'Non';
    html += `<label class="tk-switch" title="Envoyer un mail au titulaire à chaque nouvelle tâche (m.mokhtari@hecg.fr en copie)"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleNotif(this.checked)"><span class="tg"></span>${svg('mail',15)} Notifications mail</label>`;
    html += `<label class="tk-switch" title="Rappel automatique toutes les 2 h (7 h–18 h, lun.–ven.) des tâches du jour et en retard, m.mokhtari@hecg.fr en copie"><input type="checkbox" ${S.params.relanceAuto !== 'Non' ? 'checked' : ''} onchange="toggleRelance(this.checked)"><span class="tg"></span>${svg('mail',15)} Relances 2 h</label>`;
    html += `<button class="tk-btn ico" title="Paramètres : catégories" onclick="openSettings()">${svg('gear',17)}</button>`;
    html += `<button class="tk-btn ico" title="Importer les missions envoyées par mail (#mission)" onclick="aspirer(this)">${svg('inbox',17)}</button>`;
  }
  if (IS_ADMIN) html += `<button class="tk-btn ${S.selMode ? 'on' : ''}" title="Sélectionner plusieurs tâches pour les purger" onclick="toggleSelMode()">${svg('sq',16)} ${S.selMode ? 'Terminer la sélection' : 'Sélectionner'}</button>`;
  html += `<button class="tk-btn ico" title="Exporter en CSV" onclick="exportCsv()">${svg('down',17)}</button>`;
  if (IS_ADMIN) html += `<button class="tk-btn dark" onclick="openNew()">${svg('plus',16,2.4)} Ajouter une tâche</button>`;
  h.innerHTML = html;
  document.getElementById('pageTitle').textContent = IS_ADMIN ? 'Tâches de l\'équipe' : 'Mes tâches';
  document.getElementById('crumbScope').textContent = IS_ADMIN ? 'Tâches de l\'équipe' : 'Mes tâches';
  const sel = document.getElementById('fCat'), v = sel.value;
  sel.innerHTML = '<option value="">Toutes catégories</option>' + S.cats.map(c => `<option value="${esc(c.id)}">${esc(c.nom)}</option>`).join('');
  sel.value = v;
}

function renderTabs() {
  const open = t => t.statut !== 'Clôturé';
  let tabs = [];
  if (IS_ADMIN) {
    const emails = new Set(S.taches.map(t => t.email).filter(Boolean));
    const membres = [...emails].map(e => ({ email: e, nom: (personne(e) || {}).nom || (S.taches.find(t => t.email === e) || {}).collab || e }))
      .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    tabs = membres.map(m => ({ k: m.email, l: 'Tâches de ' + m.nom.split(' ')[0], av: avatar(m.nom, m.email), n: S.taches.filter(t => t.email === m.email && open(t)).length }));
    tabs.push({ k: 'all', l: 'Toutes les tâches', n: S.taches.filter(open).length });
    if (!tabs.find(t => t.k === S.tab)) S.tab = 'all';
  } else tabs = [{ k: ME, l: 'Mes tâches', n: S.taches.filter(open).length }];
  document.getElementById('tabs').innerHTML = tabs.map(t => `<button class="tk-tab ${S.tab === t.k ? 'on' : ''}" onclick="setTab('${jsq(t.k)}')">${t.av || ''}${esc(t.l)}<span class="n">${t.n}</span></button>`).join('');
}
function setTab(k) { S.tab = k; renderTabs(); render(); renderBulk(); }

// ── liste ───────────────────────────────────────────────────────────────
function visible() {
  const q = norm(document.getElementById('fSearch').value), fc = document.getElementById('fCat').value;
  return S.taches.filter(t => (S.tab === 'all' || t.email === S.tab)
    && (!fc || t.categorie === fc)
    && (!q || norm(t.titre + ' ' + t.detail + ' ' + t.mandatLabel + ' ' + t.commentaire + ' ' + nomDe(t)).includes(q)));
}
const sorter = (a, b) => (b.urgent - a.urgent) || ((a.echeance || '9999') < (b.echeance || '9999') ? -1 : (a.echeance || '9999') > (b.echeance || '9999') ? 1 : 0) || (a.date < b.date ? 1 : -1);

function render() {
  if (!S.loaded) return;
  const list = visible(), today = todayISO(), showDone = document.getElementById('fDone').checked;
  const A = list.filter(t => t.statut !== 'Clôturé' && t.echeance && t.echeance <= today).sort(sorter);
  const B = list.filter(t => t.statut !== 'Clôturé' && (!t.echeance || t.echeance > today)).sort(sorter);
  const C = list.filter(t => t.statut === 'Clôturé').sort((a, b) => (b.faitLe || b.date) > (a.faitLe || a.date) ? 1 : -1).slice(0, 200);
  const head = `<div class="tk-grid tk-head"><div></div><div>Tâche</div><div class="c-who">Titulaire</div><div>Échéance</div><div style="text-align:center">Urgent</div><div class="c-cat">Catégorie</div><div class="c-mandat">Mandat lié</div><div class="c-com">Commentaire</div></div>`;
  const zone = (k, titre, rows, tagHtml, canAdd) => {
    const closed = S.closed[k];
    S.zoneIds[k] = rows.map(t => t.id);
    const allSel = rows.length && rows.every(t => S.sel.has(t.id));
    const zsel = S.selMode && rows.length ? `<span class="tk-zsel" onclick="event.stopPropagation();selectZone('${k}')">${allSel ? 'Tout désélectionner' : 'Tout sélectionner'}</span>` : '';
    return `<section class="tk-zone" data-z="${k}">
      <div class="tk-zh ${closed ? 'closed' : ''}" onclick="toggleZone('${k}')"><span class="chev">${svg('chev',16,2.4)}</span><b>${titre}</b><span class="n">${rows.length}</span>${tagHtml || ''}${zsel}</div>
      ${closed ? '' : head + (rows.length ? rows.map(rowHtml).join('') : `<div class="tk-empty">Aucune tâche ici.</div>`)
        + (canAdd && IS_ADMIN ? `<div class="tk-add" onclick="quickAdd(this,'${k}')">${svg('plus',15,2.4)} Ajouter une tâche</div>` : '')}
    </section>`;
  };
  const late = A.filter(t => t.echeance < today).length;
  document.getElementById('board').innerHTML =
    zone('A', 'A. Tâches du jour et en retard', A, late ? `<span class="tag" style="background:#fff1f1;color:#e5484d">${late} en retard</span>` : '', true)
    + zone('B', 'B. Tâches à venir', B, '', true)
    + (showDone ? zone('C', 'Terminées', C, '', false) : '')
    + `<div class="tk-foot">${list.length} tâche${list.length > 1 ? 's' : ''} · ${list.filter(t => t.statut === 'Clôturé').length} terminée(s)</div>`;
}
function toggleZone(k) { S.closed[k] = !S.closed[k]; render(); }

// ── sélection multiple & purge ─────────────────────────────────────────
function toggleSelMode() { S.selMode = !S.selMode; if (!S.selMode) S.sel.clear(); renderHead(); render(); renderBulk(); }
function toggleSel(id) { if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); renderBulk(); }
function selectZone(k) { const ids = S.zoneIds[k] || []; const all = ids.every(id => S.sel.has(id)); ids.forEach(id => all ? S.sel.delete(id) : S.sel.add(id)); render(); renderBulk(); }
function renderBulk() {
  let bar = document.getElementById('tkBulk');
  if (!S.selMode || !S.sel.size) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'tkBulk'; bar.className = 'tk-bulk tk'; document.body.appendChild(bar); }
  bar.innerHTML = `<span><b>${S.sel.size}</b> tâche${S.sel.size > 1 ? 's' : ''} sélectionnée${S.sel.size > 1 ? 's' : ''}</span>

// ── mises à jour ─────────────────────────────────────────────────────────
async function patch(id, champs, msgOk) {
  const t = S.taches.find(x => x.id === id); if (!t) return;
  const avant = { ...t };
  // mise à jour optimiste
  if ('fait' in champs) { t.statut = champs.fait ? 'Clôturé' : 'Attribué'; t.faitPar = champs.fait ? (user.nom || '') : ''; t.faitLe = champs.fait ? todayISO() : ''; }
  ['titre','detail','email','collab','echeance','urgent','categorie','mandatType','mandatId','mandatLabel','commentaire'].forEach(k => { if (k in champs) t[k] = champs[k]; });
  if (champs.supprimer) S.taches = S.taches.filter(x => x.id !== id);
  renderTabs(); render();
  const row = document.querySelector(`.tk-row[data-id="${CSS.escape(id)}"]`); if (row && 'fait' in champs && champs.fait) row.classList.add('flash');
  try {
    const r = await api({ action:'saveTache', id, champs });
    if (!r.success) throw new Error(r.message);
    if (r.tache) Object.assign(t, r.tache);
    if (msgOk) toast(msgOk);
    if (r.mailEnvoye) toast('Mail de notification envoyé ✓');
    sessionStorage.removeItem(CK);
  } catch (e) {
    Object.assign(t, avant); if (champs.supprimer) S.taches.push(t);
    renderTabs(); render(); toast('Erreur : ' + (e.message || e), true);
  }
}
function toggleDone(id) { const t = S.taches.find(x => x.id === id); patch(id, { fait: t.statut !== 'Clôturé' }); }
function toggleUrgent(id) { const t = S.taches.find(x => x.id === id); patch(id, { urgent: !t.urgent }); }

// ── popovers ─────────────────────────────────────────────────────────────
function closePop() { document.querySelectorAll('.tk-pop').forEach(p => p.remove()); document.removeEventListener('mousedown', outside); }
function outside(e) { const p = document.querySelector('.tk-pop'); if (p && !p.contains(e.target)) closePop(); }
function openPop(anchor, html, minW) {
  closePop();
  const p = document.createElement('div'); p.className = 'tk-pop'; p.innerHTML = html; if (minW) p.style.minWidth = minW + 'px';
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect();
  let x = r.left, y = r.bottom + 6;
  if (x + p.offsetWidth > innerWidth - 10) x = innerWidth - p.offsetWidth - 10;
  if (y + p.offsetHeight > innerHeight - 10) y = Math.max(10, r.top - p.offsetHeight - 6);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  setTimeout(() => document.addEventListener('mousedown', outside), 0);
  return p;
}
function popWho(ev, id, cb) {
  ev.stopPropagation();
  const list = S.equipe.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  const p = openPop(ev.currentTarget, `<input placeholder="Rechercher un membre" oninput="filterPop(this)">` + list.map(e =>
    `<div class="it" data-s="${esc(norm(e.nom))}" data-email="${esc(e.email)}" data-nom="${esc(e.nom)}">${avatar(e.nom, e.email)}${esc(e.nom)}<span class="sub">${esc(e.role || '')}${e.sansEmail ? ' · sans mail' : ''}</span></div>`).join('') + (list.length ? '' : '<div class="grp">Liste du personnel indisponible (serveur pas à jour ?)</div>'), 300);
  p.querySelector('input').focus();
  p.addEventListener('click', e => { const it = e.target.closest('.it'); if (!it) return; closePop();
    if (cb) cb(it.dataset.email, it.dataset.nom); else patch(id, { email: it.dataset.email, collab: it.dataset.nom }, 'Tâche réattribuée à ' + it.dataset.nom); });
}
function filterPop(inp) { const q = norm(inp.value); inp.parentElement.querySelectorAll('.it').forEach(it => it.style.display = !q || it.dataset.s.includes(q) ? '' : 'none'); }
function popCat(ev, id, cb) {
  ev.stopPropagation();
  const p = openPop(ev.currentTarget, `<div class="it" data-id="">Aucune catégorie</div>` + S.cats.map(c =>
    `<div class="it" data-id="${esc(c.id)}"><span class="tk-cat" style="background:${c.couleur}17;color:${c.couleur}"><i style="background:${c.couleur}"></i>${esc(c.nom)}</span></div>`).join('')
    + (IS_ADMIN ? `<div class="it" style="color:var(--mu)" data-set="1">${svg('gear',14)} Gérer les catégories…</div>` : ''), 220);
  p.addEventListener('click', e => { const it = e.target.closest('.it'); if (!it) return; closePop();
    if (it.dataset.set) return openSettings();
    if (cb) cb(it.dataset.id); else patch(id, { categorie: it.dataset.id }); });
}
function editDate(ev, id) {
  ev.stopPropagation();
  const cell = ev.currentTarget, t = S.taches.find(x => x.id === id);
  cell.innerHTML = `<input type="date" class="tk-inline" value="${esc(t.echeance)}">`;
  const inp = cell.querySelector('input'); inp.focus(); try { inp.showPicker(); } catch (e) {}

  inp.addEventListener('change', fin); inp.addEventListener('blur', () => setTimeout(fin, 120));

function editCom(ev, id) {
  ev.stopPropagation();
  const cell = ev.currentTarget, t = S.taches.find(x => x.id === id);

  const inp = cell.querySelector('input'); inp.focus(); inp.select();

  const fin = save => { if (done) return; done = true; if (save && inp.value.trim() !== t.commentaire) patch(id, { commentaire: inp.value.trim() }); else render(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); });
  inp.addEventListener('blur', () => fin(true));
}

// Mandat : saisie des premiers caractères → suggestions (étudiants, entreprises, contacts, équipe, classes, offres)
function searchMandats(q) {
  q = norm(q).trim(); if (q.length < 2) return [];
  const words = q.split(/\s+/);
  const out = [];
  for (const m of S.mandats) {
    const hay = norm(m[2] + ' ' + m[1] + ' ' + m[3]);
    if (words.every(w => hay.includes(w))) { out.push(m); if (out.length >= 40) break; }
  }
  const rank = m => (norm(m[2]).startsWith(q) ? 0 : 1);
  return out.sort((a, b) => rank(a) - rank(b)).slice(0, 14);
}
function popMandat(ev, id, cb) {
  ev.stopPropagation();
  const t = id ? S.taches.find(x => x.id === id) : null;
  const p = openPop(ev.currentTarget, `<input placeholder="Étudiant, entreprise, contact, classe…" value="${esc(t ? t.mandatLabel : '')}"><div class="res"></div>`, 340);
  const inp = p.querySelector('input'), res = p.querySelector('.res');
  let items = [], act = 0;
  const choose = m => { closePop(); const v = m ? { mandatType: m[0], mandatId: m[1], mandatLabel: m[2] } : { mandatType: inp.value.trim() ? 'autre' : '', mandatId: '', mandatLabel: inp.value.trim() }; if (cb) cb(v); else patch(id, v); };
  const draw = () => {
    items = searchMandats(inp.value); act = 0;
    if (!S.mandats.length) { res.innerHTML = `<div class="grp">Suggestions indisponibles</div>`; return; }
    res.innerHTML = (items.length ? items.map((m, i) => `<div class="it ${i === act ? 'act' : ''}" data-i="${i}"><span class="mty">${esc(MTYPE[m[0]] || m[0])}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m[2])}</span><span class="sub">${esc(m[3])}</span></div>`).join('')
      : (inp.value.trim().length >= 2 ? `<div class="grp">Aucune correspondance</div>` : `<div class="grp">Tapez au moins 2 lettres</div>`))
      + (inp.value.trim() ? `<div class="it" data-free="1" style="color:var(--mu)">Utiliser « ${esc(inp.value.trim())} » tel quel</div>` : '')
      + (t && t.mandatLabel ? `<div class="it" data-clear="1" style="color:var(--red)">${svg('x',13)} Retirer le mandat</div>` : '');
  };
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(0, Math.min(items.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); res.querySelectorAll('[data-i]').forEach((el, i) => el.classList.toggle('act', i === act)); }
    if (e.key === 'Enter') { e.preventDefault(); choose(items[act] || null); }
    if (e.key === 'Escape') closePop();
  });
  res.addEventListener('click', e => { const it = e.target.closest('.it'); if (!it) return;
    if (it.dataset.clear) { closePop(); const v = { mandatType: '', mandatId: '', mandatLabel: '' }; if (cb) cb(v); else patch(id, v); return; }
    choose(it.dataset.free ? null : items[+it.dataset.i]); });
  inp.focus(); inp.select(); draw();
}

      ${IS_ADMIN || mine ? `<textarea class="tk-in" id="dC" style="min-height:70px">${esc(t.commentaire)}</textarea>` : `<p>${esc(t.commentaire) || '<span class="tk-ph">—</span>'}</p>`}
      ${notes.length ? `<div class="tk-notes"><label class="tk-fl" style="margin-top:0">Historique</label>${notes.map(n => `<div class="tk-note">${esc(n)}</div>`).join('')}</div>` : ''}
      ${IS_ADMIN || mine ? `<div class="tk-ft"><button class="tk-btn dark" onclick="saveDrawer('${jsq(id)}')">Enregistrer</button></div>` : ''}
    </div>`;
  document.body.append(bd, d);
}
function closeTask() { document.querySelectorAll('.tk-drawer,.tk-backdrop').forEach(e => e.remove()); }
function saveDrawer(id) {
  const t = S.taches.find(x => x.id === id); const champs = {};
  const T = document.getElementById('dT'), D = document.getElementById('dD'), C = document.getElementById('dC');
  if (T && T.value.trim() !== t.titre) champs.titre = T.value.trim();
  if (D && D.value !== t.detail) champs.detail = D.value;
  if (C && C.value.trim() !== t.commentaire) champs.commentaire = C.value.trim();
  closeTask();
  if (Object.keys(champs).length) patch(id, champs, 'Tâche enregistrée ✓');
}
function delTask(id) { if (!confirm('Supprimer cette tâche ? Elle sera archivée (statut « Annulé ») dans la feuille MISSIONS.')) return; closeTask(); patch(id, { supprimer: true }, 'Tâche supprimée'); }

// ── paramètres (admin) ───────────────────────────────────────────────────
let CATS = [];
function openSettings() {
  CATS = S.cats.map(c => ({ ...c }));
  const m = document.createElement('div'); m.className = 'tk-modal tk'; m.id = 'mSet';
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.innerHTML = `<div class="box"><h2>Paramètres des tâches</h2><p class="sub">Vos catégories et leurs couleurs. Elles apparaissent pour toute l'équipe.</p>
    <label class="tk-fl">Catégories</label><div id="catList"></div>
    <button class="tk-btn sm" onclick="CATS.push({id:'',nom:'',couleur:PALETTE[CATS.length%PALETTE.length]});drawCats(true)">${svg('plus',14,2.4)} Ajouter une catégorie</button>
    <div class="tk-ft"><button class="tk-btn" onclick="this.closest('.tk-modal').remove()">Annuler</button><button class="tk-btn dark" onclick="saveSettings()">Enregistrer</button></div></div>`;
  document.body.appendChild(m); drawCats();
}
function drawCats(focusLast) {
  document.getElementById('catList').innerHTML = CATS.map((c, i) => `<div class="tk-catrow">
    <span class="tk-cat" style="background:${c.couleur}17;color:${c.couleur};min-width:14px;padding:4px 6px"><i style="background:${c.couleur}"></i></span>
    <input value="${esc(c.nom)}" placeholder="Nom de la catégorie" oninput="CATS[${i}].nom=this.value">
    <div class="tk-dots">${PALETTE.map(p => `<span class="tk-dot ${p === c.couleur ? 'on' : ''}" style="background:${p}" onclick="CATS[${i}].couleur='${p}';drawCats()"></span>`).join('')}</div>
    <button class="tk-mini" title="Monter" onclick="if(${i}>0){CATS.splice(${i - 1},0,CATS.splice(${i},1)[0]);drawCats()}">${svg('up',13)}</button>
    <button class="tk-mini" title="Supprimer" onclick="CATS.splice(${i},1);drawCats()">${svg('trash',13)}</button></div>`).join('') || '<p class="tk-ph" style="margin-bottom:10px">Aucune catégorie.</p>';
  if (focusLast) { const ins = document.querySelectorAll('#catList input'); if (ins.length) ins[ins.length - 1].focus(); }
}
async function saveSettings() {
  const cats = CATS.filter(c => c.nom.trim()).map((c, i) => ({ ...c, id: c.id || ('CAT' + Date.now() + i), nom: c.nom.trim() }));
  const r = await api({ action:'saveTachesParams', categories: cats });
  if (!r.success) { toast('Erreur : ' + r.message, true); return; }
  S.cats = cats; document.getElementById('mSet').remove(); sessionStorage.removeItem(CK); renderAll(); toast('Catégories enregistrées ✓');
}
async function toggleNotif(on) {
  S.params.notifMail = on ? 'Oui' : 'Non';
  const r = await api({ action:'saveTachesParams', notifMail: on });
  if (!r.success) { toast('Erreur : ' + r.message, true); return; }
  sessionStorage.removeItem(CK);
  toast(on ? 'Notifications mail activées' : 'Notifications mail désactivées');
}
async function toggleRelance(on) {
  S.params.relanceAuto = on ? 'Oui' : 'Non';
  const r = await api({ action:'saveTachesParams', relanceAuto: on });
  if (!r.success) { toast('Erreur : ' + r.message, true); return; }
  sessionStorage.removeItem(CK);
  toast(on ? 'Relances automatiques activées (toutes les 2 h)' : 'Relances automatiques désactivées');
}

// ── divers ──────────────────────────────────────────────────────────────
async function aspirer(btn) {
  btn.disabled = true;
  try { const r = await api({ action:'aspirerMissionsNow' }); toast(r.success ? (r.async ? 'Import des mails #mission lancé…' : (r.nb ? r.nb + ' tâche(s) importée(s)' : 'Aucun nouveau mail #mission')) : 'Erreur : ' + r.message, !r.success); if (r.success) setTimeout(() => load(true), r.async ? 20000 : 500); }
  finally { btn.disabled = false; }
}
function exportCsv() {
  const rows = visible();
  const L = a => a.map(v => { const s = String(v == null ? '' : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';');
  const csv = [L(['Terminée','Tâche','Détail','Titulaire','Échéance','Urgent','Catégorie','Mandat lié','Commentaire','Créée le'])]
    .concat(rows.map(t => L([t.statut === 'Clôturé' ? 'Oui' : 'Non', t.titre, t.detail, nomDe(t), fmtD(t.echeance), t.urgent ? 'Oui' : '', (cat(t.categorie) || {}).nom || '', t.mandatLabel, t.commentaire, fmtD(t.date)]))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' })); a.download = 'Taches_HECG_' + todayISO() + '.csv'; a.click();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); closeTask(); } });

renderHead();
load();
</script>
<script>(function(){var SIX_H=6*60*60*1000;function touch(){localStorage.setItem('_lastAct',Date.now());}function check(){var t=parseInt(localStorage.getItem('_lastAct')||'0',10);if(t&&Date.now()-t>SIX_H){localStorage.clear();window.location.href='index.html';}}touch();['click','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});setInterval(check,60000);})();</script>
