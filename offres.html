    <script>
        window.onerror = function(msg, src, line, col, err) {
            const loader = document.getElementById('loader');
            if (loader) { loader.classList.remove('hidden'); loader.innerHTML = `<p class="text-red-600 font-black">🚨 Erreur JS (ligne ${line}): ${msg}</p><p class="text-xs text-gray-400 mt-1 font-mono">${src}</p>`; }
        };

        const API_URL = "https://script.google.com/macros/s/AKfycbwfwxfVa2968AgKLdwwV8VIazVACVPVypKXrEUTc-zTuQ08gda8m5_qPfC2BgMyJMwb/exec";

        let currentOffres = [];
        let showObsolete = false;
        let showPartagee = true;
        let _statsClickData = [];

        // --- POSTIER CENTRAL ---
        async function apiPost(payload) {
            const userSession = JSON.parse(localStorage.getItem('user') || '{}');
            payload.idAuteur = userSession.nom || "Utilisateur Inconnu";
            payload.roleAuteur = userSession.role || "Utilisateur";
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (e) {
                console.error("Erreur API :", e);
                return { success: false, message: "Erreur réseau." };
            }
        }

        // 1. LE CHARGEUR (Récupère la donnée et la stocke)
        async function loadOffres() {
            const loader = document.getElementById('loader');
            try {
                loader.classList.remove('hidden');
                document.getElementById('offresGrid').classList.add('hidden');

                const data = await apiPost({ action: 'getOffres' });

                loader.classList.add('hidden');
                document.getElementById('offresGrid').classList.remove('hidden');

                currentOffres = (data.success && Array.isArray(data.data)) ? data.data : [];
                populateVilleFilter();
                populateEntrepriseFilter();
                renderStats(computeStats());
                updateToggleBtns();
                filterOffres();
                if (!data.success) {
                    console.warn('getOffres API error:', data.message);
                }
            } catch (err) {
                loader.classList.add('hidden');
                const grid = document.getElementById('offresGrid');
                grid.classList.remove('hidden');
                grid.innerHTML = `<div class="col-span-full text-center py-16">
                    <p class="text-red-500 font-black text-lg mb-2">⚠️ Erreur de chargement</p>
                    <p class="text-gray-500 text-sm mb-1">Impossible de contacter le serveur. Vérifiez votre connexion internet.</p>
                    <p class="text-gray-300 text-xs mt-2 font-mono">${err && err.message ? err.message : String(err)}</p>
                    <button onclick="loadOffres()" class="mt-4 px-5 py-2 bg-[#1A4E8A] text-white rounded-xl font-bold text-sm hover:bg-blue-800 transition">🔄 Réessayer</button>
                </div>`;
                renderStats(computeStats());
                updateToggleBtns();
            }
        }

        function populateVilleFilter() {
            const sel = document.getElementById('fOffreVille');
            const villes = [...new Set(currentOffres.map(o => String(o.ville || "").trim()).filter(Boolean))].sort();
            sel.innerHTML = '<option value="">📍 Toutes les villes</option>' + villes.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function populateEntrepriseFilter() {
            const sel = document.getElementById('fOffreEntreprise');
            const entreprises = [...new Set(currentOffres.map(o => String(o.entreprise || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
            sel.innerHTML = '<option value="">🏢 Toutes les entreprises</option>' + entreprises.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        // 2. LE MOTEUR DE FILTRAGE
        function filterOffres() {
            const elSearch = document.getElementById('fOffreRecherche');
            if (!elSearch) return renderOffres(currentOffres);

            const search = document.getElementById('fOffreRecherche').value.toLowerCase().trim();
            const qualite = document.getElementById('fOffreQualite').value.toLowerCase();
            const partage = document.getElementById('fOffrePartage').value.toLowerCase();
            const villeFilter = (document.getElementById('fOffreVille').value || "").trim();
            const entrepriseFilter = (document.getElementById('fOffreEntreprise').value || "").trim();
            const dateFilter = document.getElementById('fOffreDate').value; // "YYYY-MM-DD" ou ""

            let filteredData = currentOffres.filter(o => {
                const textGlobal = `${o.id || ''} ${o.poste || ''} ${o.entreprise || ''} ${o.ville || ''}`.toLowerCase();
                const matchSearch = textGlobal.includes(search);

                const qualiteOffre = (o.qualite || "").toLowerCase();
                const matchQualite = qualite === "" || qualiteOffre.includes(qualite);

                let etatOffre = (o.etat || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                let estPartage = etatOffre.includes("partagee") || etatOffre.includes("partage");
                if (etatOffre.includes("non")) estPartage = false;
                let matchPartage = true;
                if (partage === "partagée") matchPartage = estPartage === true;
                if (partage === "non partagée") matchPartage = estPartage === false;

                const matchVille = !villeFilter || String(o.ville || "").trim() === villeFilter;
                const matchEntreprise = !entrepriseFilter || String(o.entreprise || "").trim() === entrepriseFilter;

                let matchDate = true;
                if (dateFilter) {
                    const d = new Date(o.date);
                    if (isNaN(d)) {
                        matchDate = false;
                    } else {
                        const [y, m, day] = dateFilter.split('-').map(Number);
                        matchDate = d.getFullYear() === y && (d.getMonth() + 1) === m && d.getDate() === day;
                    }
                }

                return matchSearch && matchQualite && matchPartage && matchVille && matchEntreprise && matchDate;
            });

            // Masquer les obsolètes par défaut (sauf si filtre qualité actif sur "obsolète")
            if (!showObsolete && !qualite.includes("obsolete") && !qualite.includes("obsolète")) {
                filteredData = filteredData.filter(o => {
                    const q = (o.qualite || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                    return !q.includes("obsolete");
                });
            }

            // Masquer les partagées par défaut (sauf si filtre partage actif)
            if (!showPartagee && partage === "") {
                filteredData = filteredData.filter(o => {
                    const e = (o.etat || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                    const estPartage = (e.includes("partag")) && !e.includes("non");
                    return !estPartage;
                });
            }

            renderOffres(filteredData);
            refreshMapMarkers();
        }

        // 3. LE DESSINATEUR (Génère le HTML)
        function renderOffres(data) {
            _lastRendered = data;
            const grid = document.getElementById('offresGrid');
            if (!data || data.length === 0) {
                const msg = currentOffres.length === 0
                    ? 'Aucune offre disponible. Ajoutez votre première offre avec le bouton ci-dessus.'
                    : 'Aucune offre ne correspond à ces filtres.';
                grid.innerHTML = `<div class="col-span-full text-center py-10"><p class="text-gray-400 font-bold italic">${msg}</p></div>`;
                return;
            }
            
            grid.innerHTML = data.map(o => {
                let nomPlateforme = o.Plateforme || o.plateforme || "Inconnu";
                let pf = nomPlateforme.toLowerCase();
                let logoHTML = `<span class="px-2 py-1 text-[10px] font-bold text-gray-600 bg-gray-100 rounded shadow-sm">${nomPlateforme}</span>`; 
                
                if (pf.includes("linkedin")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=linkedin.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="LinkedIn">`;
                else if (pf.includes("indeed")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=indeed.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="Indeed">`;
                else if (pf.includes("france travail") || pf.includes("francetravail") || pf.includes("pole emploi")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=francetravail.fr&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="France Travail">`;
                else if (pf.includes("google")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="Google Jobs">`;

                let brutQualite = o.qualite || "À QUALIFIER";
                let qualiteTexte = brutQualite.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                let bgCarte = "bg-white border-gray-100"; 
                let badgeQualite = "bg-gray-100 text-gray-600 border-gray-200";

                if (qualiteTexte.includes("qualifier")) { bgCarte = "bg-yellow-50 border-yellow-400"; badgeQualite = "bg-yellow-100 text-yellow-800 border-yellow-300"; } 
                else if (qualiteTexte.includes("obsolete") || qualiteTexte.includes("annule")) { bgCarte = "bg-red-50 border-red-300 opacity-80"; badgeQualite = "bg-red-100 text-red-800 border-red-200"; } 
                else if (qualiteTexte.includes("valide") || qualiteTexte.includes("vérifiée")) { bgCarte = "bg-green-50 border-green-400"; badgeQualite = "bg-green-100 text-green-800 border-green-300"; }

                let brutEtat = o.etat || "Non partagée";
                let etatTexte = brutEtat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                let estPartage = etatTexte.includes("partagee") || etatTexte.includes("partage");
                if (etatTexte.includes("non")) estPartage = false;
                if (estPartage) bgCarte = "bg-green-50 border-green-500";
                let badgePartage = estPartage ? "bg-green-100 text-green-800 border-green-300" : "bg-slate-100 text-slate-500 border-slate-200";

                const namesHTML = estPartage && o.destinataires && o.destinataires.length > 0 
                    ? `<details class="mt-3 group">
                         <summary class="text-[9px] font-black text-blue-500 cursor-pointer uppercase list-none focus:outline-none hover:underline">
                            👥 Voir les ${o.destinataires.length} partages
                         </summary>
                         <div class="flex flex-wrap gap-1 mt-2 p-2 bg-white/50 rounded-xl border border-blue-100">
                            ${o.destinataires.map(name => `<span class="px-2 py-0.5 bg-white text-[#1A4E8A] rounded text-[9px] font-bold border border-blue-100 shadow-sm">${name}</span>`).join('')}
                         </div>
                       </details>`
                    : `<p class="text-[9px] text-slate-400 italic mt-3 font-bold uppercase tracking-tighter">Aucun partage effectué</p>`;

                const lastNoteHtml = o.dernierNote

                       </div>`
                    : '';

                return `
                <div class="${bgCarte} rounded-[2rem] shadow-sm border p-6 flex flex-col justify-between hover:shadow-xl transition-all duration-300 group">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex gap-2">
                                <span class="px-2 py-1 text-[10px] font-black uppercase rounded border shadow-sm ${badgeQualite}">${brutQualite}</span>
                                <span class="px-2 py-1 text-[10px] font-black uppercase rounded border shadow-sm ${badgePartage}">${brutEtat}</span>
                            </div>
                            <div class="ml-2">${logoHTML}</div>
                        </div>
                        <span class="text-[10px] font-black text-slate-400 mb-1 block">N° ${o.id || '-'}</span>
                        <h3 class="text-xl font-black text-gray-800 mb-1 leading-tight group-hover:text-[#1A4E8A] transition-colors">${o.poste || 'Sans titre'}</h3>
                        <p class="text-[#F26522] font-black text-sm mb-1 uppercase">🏢 ${o.entreprise}</p>
                        ${o.ville ? `<p class="text-[10px] font-bold text-slate-500 mb-3">📍 ${o.ville}</p>` : '<p class="mb-3"></p>'}
                        <p class="text-[10px] font-bold text-gray-400 tracking-tighter mb-2">📅 Parue le ${new Date(o.date).toLocaleDateString()}</p>
                        <div class="mt-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                            <p class="text-[9px] font-black text-gray-400 uppercase mb-1">📝 (notes interne) :</p>
                            <p class="text-[11px] text-gray-600 font-medium italic leading-snug">${o.missions || 'Aucune note.'}</p>
                        </div>
                        ${lastNoteHtml}
                        ${namesHTML}
                    </div>
                    <div class="mt-4 border-t border-gray-100 pt-3">
                        <details class="group/journal">
                            <summary class="text-[9px] font-black text-[#1A4E8A] uppercase cursor-pointer list-none hover:underline focus:outline-none">📋 Journal de suivi ↓</summary>
                            <div id="journal-${o.id}" class="mt-2 space-y-1">
                                <p class="text-[10px] text-gray-400 italic">Chargement...</p>
                            </div>
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="note-input-${o.id}" placeholder="Ajouter une note de suivi..." class="flex-1 border border-gray-200 rounded-xl p-2 text-xs outline-none focus:border-[#1A4E8A]">
                                <button onclick="addOffreNote('${o.id}')" class="px-3 py-2 bg-[#1A4E8A] text-white rounded-xl text-[10px] font-black hover:bg-blue-800 transition whitespace-nowrap">+ Note</button>
                            </div>
                        </details>
                    </div>
                    <div class="flex justify-between items-center mt-4 border-t border-gray-50 pt-4">
                        <a href="${o.url}" target="_blank" class="text-blue-500 font-black text-[10px] hover:underline uppercase tracking-widest">Voir l'annonce ↗</a>
                        <div class="flex space-x-1">
                            <button onclick="openModal('${o.id}')" class="p-2 bg-gray-50 rounded-xl text-gray-400 hover:text-blue-500 hover:bg-white hover:shadow-sm transition" title="Modifier">✏️</button>
                            <button onclick="openShareModal('${o.id}')" class="p-2 bg-gray-50 rounded-xl text-gray-400 hover:text-blue-600 hover:bg-white hover:shadow-sm transition" title="Partager">📡</button>
                            <button onclick="deleteOffre('${o.id}')" class="p-2 bg-gray-50 rounded-xl text-gray-400 hover:text-red-500 hover:bg-white hover:shadow-sm transition" title="Supprimer">🗑️</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Helper : set select by value insensible à la casse
        function setSelectCI(selId, val) {
            const sel = document.getElementById(selId);
            if (!sel || val === undefined || val === null) return;
            const norm = String(val).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
            for (const opt of sel.options) {
                const optNorm = opt.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                if (optNorm === norm || norm.includes(optNorm) || optNorm.includes(norm)) {
                    sel.value = opt.value;
                    return;
                }
            }
            // fallback : valeur brute
            sel.value = val;
        }

        // 4. MODAL AJOUT / MODIF
        function openModal(id = null) {
            document.getElementById('offreModal').classList.replace('hidden', 'flex');
            if(id) {
                const o = currentOffres.find(x => x.id === id);
                document.getElementById('modalTitle').innerText = "Modifier l'Offre";
                document.getElementById('formOffreId').value = o.id;
                document.getElementById('offrePoste').value = o.poste || "";
                document.getElementById('offreEnt').value = o.entreprise;
                document.getElementById('offreUrl').value = o.url;
                document.getElementById('offrePlateforme').value = o.plateforme || '';
                document.getElementById('offreVille').value = o.ville || '';
                document.getElementById('offreMissions').value = o.missions || '';
                setSelectCI('offreQualite', o.qualite);
                setSelectCI('offreEtat', o.etat || 'Non partagée');
            } else {
                document.getElementById('modalTitle').innerText = "Ajouter une Offre";
                document.getElementById('formOffreId').value = "";
                document.getElementById('offrePoste').value = "";
                document.getElementById('offreEnt').value = "";
                document.getElementById('offreUrl').value = "";
                document.getElementById('offrePlateforme').value = "";
                document.getElementById('offreQualite').value = "À Qualifier";
                document.getElementById('offreEtat').value = "Non partagée";
            }
        }
        function closeModal() { document.getElementById('offreModal').classList.replace('flex', 'hidden'); }

        async function saveOffre() {
            const btn = document.getElementById('btnSaveOffre');
            const payload = {
                action: document.getElementById('formOffreId').value ? 'updateOffre' : 'addOffre',
                id: document.getElementById('formOffreId').value,
                poste: document.getElementById('offrePoste').value,
                entreprise: document.getElementById('offreEnt').value,
                url: document.getElementById('offreUrl').value,
                plateforme: document.getElementById('offrePlateforme').value,
                ville: document.getElementById('offreVille').value,
                missions: document.getElementById('offreMissions').value,
                qualite: document.getElementById('offreQualite').value,
                etat: document.getElementById('offreEtat').value
            };
            if(!payload.poste || !payload.entreprise || !payload.url) return alert("Veuillez remplir les champs obligatoires.");
            
            btn.disabled = true; btn.innerText = "Enregistrement...";
            await apiPost(payload);
            btn.disabled = false; btn.innerText = "Enregistrer";
            closeModal(); loadOffres();
        }

        async function deleteOffre(id) {
            if(!confirm("Êtes-vous sûr de vouloir supprimer cette offre ?")) return;
            await apiPost({ action: 'deleteOffre', id: id });
            loadOffres();
        }

        // --- JOURNAL TRACÉ DES OFFRES ---
        // Délégation : ouvre le journal quand on déplie <details>
        document.addEventListener('toggle', function(e) {
            const det = e.target;
            if (!det || det.tagName !== 'DETAILS') return;
            const sum = det.querySelector('summary');
            if (!sum || !sum.innerText.includes('Journal')) return;
            const offreId = det.closest('[id^=""]') ? null : null;
            // On cherche l'id via le div journal enfant
            const journalDiv = det.querySelector('[id^="journal-"]');
            if (!journalDiv) return;
            const idOffre = journalDiv.id.replace('journal-', '');
            if (det.open && journalDiv.innerHTML.includes('Chargement')) {
                loadOffreNotes(idOffre);
            }
        }, true);

        async function loadOffreNotes(idOffre) {
            const el = document.getElementById('journal-' + idOffre);
            if (!el) return;
            const res = await apiPost({ action: 'getOffreNotes', id_offre: idOffre });
            if (!res.success || res.data.length === 0) {
                el.innerHTML = '<p class="text-[10px] text-gray-300 italic">Aucune note consignée.</p>';
                return;
            }
            el.innerHTML = res.data.map(n => `
                <div class="bg-white border border-gray-100 rounded-xl p-2 shadow-sm">
                    <div class="flex justify-between items-center mb-0.5">
                        <span class="text-[9px] font-black text-[#1A4E8A] uppercase">${n.auteur}</span>
                        <span class="text-[9px] text-gray-400">${n.date}</span>
                    </div>
                    <p class="text-[10px] text-gray-700 leading-snug">${n.texte}</p>
                </div>
            `).join('');
        }

        async function addOffreNote(idOffre) {
            const inp = document.getElementById('note-input-' + idOffre);
            const texte = inp ? inp.value.trim() : '';
            if (!texte) return;
            inp.value = '';
            inp.disabled = true;
            const res = await apiPost({ action: 'addOffreNote', id_offre: idOffre, texte });
            inp.disabled = false;
            if (res.success) {
                // Recharger le journal ET la note de preview
                await loadOffreNotes(idOffre);
                // Mettre à jour la dernière note dans l'objet local
                const o = currentOffres.find(x => x.id === idOffre);
                if (o) {
                    const userSession = JSON.parse(localStorage.getItem('user') || '{}');
                    o.dernierNote = { auteur: userSession.nom || 'Moi', date: new Date().toLocaleDateString('fr-FR'), texte };
                    // Rafraîchir juste la preview sans recharger tout
                    const previewEl = document.querySelector(`#journal-${idOffre}`)?.closest('.group\\/journal')?.previousElementSibling;
                }
            }
        }

        // 5. GESTION DU PARTAGE AVEC LISTE ÉDITABLE EN TEMPS RÉEL
        let allStudentsCache = [];
        let recipientsList = []; // [{nom, prenom, email, isManual}]
        let selectedClassesSet = new Set(); // vide = TOUTES

        function estEligibleOffre(etu) {
            const statut = (etu.statut || "").toLowerCase();
            const typo   = (etu.typo   || "").toLowerCase();
            if (!statut && !typo) return true; // données incomplètes : on inclut par défaut
            const enRecherche = statut.includes("recherche");
            const legitime    = typo.includes("inscrit");
            const exclu       = typo.includes("sorti") || typo.includes("refus") ||
                                statut.includes("alternance") || statut.includes("initial") || statut.includes("placé");
            return enRecherche && legitime && !exclu;
        }

        async function openShareModal(id) {
            const offre = currentOffres.find(x => x.id === id);
            document.getElementById('shareOffreId').value = id;
            document.getElementById('shareOffreTitle').innerText = offre ? (offre.poste || '') : '';
            document.getElementById('shareModal').classList.replace('hidden', 'flex');

            selectedClassesSet = new Set();
            recipientsList = [];

            if (allStudentsCache.length === 0) {
                document.getElementById('loadingStudents').classList.remove('hidden');
                const d = await apiPost({ action: 'getStudentsMinList' });
                document.getElementById('loadingStudents').classList.add('hidden');
                if (d.success) allStudentsCache = d.data;
            }

            // Pills de classes
            const classes = [...new Set(allStudentsCache.map(e => e.classe).filter(Boolean))].sort();
            const zone = document.getElementById('zoneClassesPills');
            zone.innerHTML = `<button id="pillTous" onclick="togglePillTous()" class="px-3 py-1.5 text-xs font-black rounded-xl border-2 border-[#1A4E8A] bg-[#1A4E8A] text-white transition">Toutes</button>`;
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.id = 'pill-cls-' + c.replace(/\s/g,'_');
                btn.innerText = c;
                btn.dataset.classe = c;
                btn.className = 'px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-gray-200 bg-white text-gray-500 transition hover:border-[#1A4E8A]';
                btn.onclick = () => togglePillClasse(c);
                zone.appendChild(btn);
            });

            updateRecipientsFromClasses();
        }

        function togglePillTous() {
            selectedClassesSet = new Set();
            document.querySelectorAll('#zoneClassesPills button').forEach(btn => {
                if (btn.id === 'pillTous') {
                    btn.className = 'px-3 py-1.5 text-xs font-black rounded-xl border-2 border-[#1A4E8A] bg-[#1A4E8A] text-white transition';
                } else {
                    btn.className = 'px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-gray-200 bg-white text-gray-500 transition hover:border-[#1A4E8A]';
                }
            });
            updateRecipientsFromClasses();
        }

        function togglePillClasse(classe) {
            if (selectedClassesSet.has(classe)) {
                selectedClassesSet.delete(classe);
            } else {
                selectedClassesSet.add(classe);
            }
            if (selectedClassesSet.size === 0) { togglePillTous(); return; }

            document.getElementById('pillTous').className = 'px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-gray-200 bg-white text-gray-500 transition hover:border-[#1A4E8A]';
            document.querySelectorAll('#zoneClassesPills button[data-classe]').forEach(btn => {
                const sel = selectedClassesSet.has(btn.dataset.classe);
                btn.className = sel
                    ? 'px-3 py-1.5 text-xs font-black rounded-xl border-2 border-[#1A4E8A] bg-[#1A4E8A] text-white transition'
                    : 'px-3 py-1.5 text-xs font-bold rounded-xl border-2 border-gray-200 bg-white text-gray-500 transition hover:border-[#1A4E8A]';
            });
            updateRecipientsFromClasses();
        }

        function updateRecipientsFromClasses() {
            const manuals = recipientsList.filter(r => r.isManual);
            const autoEntries = allStudentsCache
                .filter(etu => {
                    if (!estEligibleOffre(etu)) return false;
                    if (selectedClassesSet.size === 0) return true;
                    return selectedClassesSet.has(etu.classe);
                })
                .map(etu => ({ nom: etu.nom, prenom: etu.prenom, email: etu.email, isManual: false }));

            const autoEmails = new Set(autoEntries.map(r => r.email.toLowerCase()));
            recipientsList = [...autoEntries, ...manuals.filter(r => !autoEmails.has(r.email.toLowerCase()))];
            renderRecipients();
        }

        function renderRecipients() {
            const zone = document.getElementById('zoneDestinataires');
            document.getElementById('nbDestinataires').innerText = recipientsList.length;
            if (recipientsList.length === 0) {
                zone.innerHTML = '<span class="text-[11px] text-gray-400 italic">Aucun destinataire éligible</span>';
                return;
            }
            zone.innerHTML = recipientsList.map((r, idx) => {
                const label = (r.prenom || r.nom) ? `${r.prenom} ${r.nom}`.trim() : r.email;
                const cls = r.isManual
                    ? 'bg-orange-50 border-orange-200 text-orange-700'
                    : 'bg-white border-blue-100 text-[#1A4E8A]';
                return `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg border text-[11px] font-bold ${cls} shadow-sm" title="${r.email}">
                    ${label}
                    <button onclick="removeRecipient(${idx})" class="ml-0.5 text-gray-300 hover:text-red-500 font-black leading-none text-sm" title="Retirer">×</button>
                </span>`;
            }).join('');
        }

        function removeRecipient(idx) {
            recipientsList.splice(idx, 1);
            renderRecipients();
        }

        function addManualEmail() {
            const input = document.getElementById('inputAddEmail');
            const email = (input.value || "").trim().toLowerCase();
            if (!email || !email.includes('@')) { alert("Adresse email invalide."); return; }
            if (recipientsList.some(r => r.email.toLowerCase() === email)) {
                alert("Cette adresse est déjà dans la liste.");
                input.value = "";
                return;
            }
            recipientsList.push({ nom: '', prenom: email.split('@')[0], email, isManual: true });
            input.value = '';
            renderRecipients();
        }

        function closeShareModal() { document.getElementById('shareModal').classList.replace('flex', 'hidden'); }

        async function confirmShare() {
            if (recipientsList.length === 0) return alert("Aucun destinataire sélectionné.");
            const idOffre = document.getElementById('shareOffreId').value;
            const btn = document.getElementById('btnConfirmShare');
            btn.disabled = true;
            btn.innerText = "Diffusion en cours... ⏳";
            try {
                const d = await apiPost({
                    action: 'partagerOffre',
                    id_offre: idOffre,
                    emailsCibles: recipientsList.map(r => r.email)
                });
                alert(d.message);
                if (d.success) { closeShareModal(); loadOffres(); }
            } catch (err) {
                alert("Erreur de connexion lors du partage.");
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 DIFFUSER L'OFFRE";
            }
        }

        // ==========================================
        // STATS & KPIs
        // ==========================================

        function normalizeStr(s) {
            return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
        }

        function computeStats() {
            const now = new Date();
            const dow = now.getDay();
            const diffToMon = (dow === 0 ? -6 : 1 - dow);
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() + diffToMon);
            weekStart.setHours(0, 0, 0, 0);

            const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
            const aujourdhui = currentOffres.filter(o => {
                const d = new Date(o.date);
                return !isNaN(d) && d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
            });
            const cetteSemaine = currentOffres.filter(o => {
                const d = new Date(o.date);
                return !isNaN(d) && d >= weekStart;
            });
            const aQualifier = currentOffres.filter(o => normalizeStr(o.qualite).includes("qualifier"));
            const partagees   = currentOffres.filter(o => {
                const e = normalizeStr(o.etat);
                return e.includes("partag") && !e.includes("non");
            });
            const obsoletes  = currentOffres.filter(o => normalizeStr(o.qualite).includes("obsolete"));
            const verifiees  = currentOffres.filter(o => normalizeStr(o.qualite).includes("verifi"));

            let moyParSemaine = "—";
            const validDates = currentOffres.map(o => new Date(o.date)).filter(d => !isNaN(d));
            if (validDates.length > 0) {
                const firstDate = new Date(Math.min(...validDates.map(d => d.getTime())));
                const weeksSince = Math.max(1, (now - firstDate) / (7 * 24 * 60 * 60 * 1000));
                moyParSemaine = (currentOffres.length / weeksSince).toFixed(1);
            }

            return { aujourdhui, cetteSemaine, total: currentOffres.length, moyParSemaine, aQualifier, partagees, obsoletes, verifiees };
        }

        function renderStats(st) {
            const kpis = [
                { label: "Aujourd'hui",     value: st.aujourdhui.length,   sub: "ajoutées",       color: "orange",  data: st.aujourdhui  },
                { label: "Cette semaine",   value: st.cetteSemaine.length, sub: "captées",        color: "blue",    data: st.cetteSemaine },
                { label: "Total captées",   value: st.total,               sub: "depuis le début",color: "indigo",  data: currentOffres  },
                { label: "Moy. / semaine",  value: st.moyParSemaine,       sub: "offres/sem.",    color: "violet",  data: null           },
                { label: "À qualifier",     value: st.aQualifier.length,   sub: "en attente",     color: "amber",   data: st.aQualifier  },
                { label: "Partagées",       value: st.partagees.length,    sub: "diffusées",      color: "teal",    data: st.partagees   },
                { label: "Obsolètes",       value: st.obsoletes.length,    sub: "à archiver",     color: "red",     data: st.obsoletes   },
                { label: "Vérifiées",       value: st.verifiees.length,    sub: "validées",       color: "emerald", data: st.verifiees   },
            ];

            const cm = {
                orange:  { bg: "bg-orange-50",  border: "border-orange-300",  val: "text-orange-700",  sub: "text-orange-400",  h: "hover:bg-orange-100"  },
                blue:    { bg: "bg-blue-50",    border: "border-blue-200",    val: "text-blue-700",    sub: "text-blue-400",    h: "hover:bg-blue-100"    },
                indigo:  { bg: "bg-indigo-50",  border: "border-indigo-200",  val: "text-indigo-700",  sub: "text-indigo-400",  h: "hover:bg-indigo-100"  },
                violet:  { bg: "bg-violet-50",  border: "border-violet-200",  val: "text-violet-700",  sub: "text-violet-400",  h: ""                     },
                amber:   { bg: "bg-amber-50",   border: "border-amber-200",   val: "text-amber-700",   sub: "text-amber-400",   h: "hover:bg-amber-100"   },
                teal:    { bg: "bg-teal-50",    border: "border-teal-200",    val: "text-teal-700",    sub: "text-teal-400",    h: "hover:bg-teal-100"    },
                red:     { bg: "bg-red-50",     border: "border-red-200",     val: "text-red-700",     sub: "text-red-400",     h: "hover:bg-red-100"     },
                emerald: { bg: "bg-emerald-50", border: "border-emerald-200", val: "text-emerald-700", sub: "text-emerald-400", h: "hover:bg-emerald-100" },
            };

            _statsClickData = kpis.map(k => ({ data: k.data, label: k.label }));

            const section = document.getElementById('statsSection');
            if (!section) return;
            section.innerHTML = kpis.map((k, idx) => {
                const c = cm[k.color];
                const isClickable = k.data !== null;
                const clickAttr = isClickable ? `onclick="openStatsDetail(${idx})"` : '';
                return `
                <div ${clickAttr} class="${c.bg} ${c.border} border rounded-2xl p-4 flex flex-col transition-all shadow-sm ${isClickable ? c.h + ' hover:shadow-md cursor-pointer' : ''}">
                    <span class="text-[9px] font-black uppercase tracking-widest ${c.sub} mb-1 leading-none">${k.label}</span>
                    <span class="text-4xl font-black ${c.val} leading-none my-2">${k.value}</span>
                    <span class="text-[9px] ${c.sub} font-bold">${k.sub}</span>
                    ${isClickable ? `<span class="text-[8px] ${c.sub} opacity-50 mt-1">Voir le listing →</span>` : ''}
                </div>`;
            }).join('');
        }

        function openStatsDetail(idx) {
            const { data, label } = _statsClickData[idx];
            if (!data || data.length === 0) { alert("Aucune offre dans cette catégorie."); return; }

        function _normCity(s) {
            return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
        }

        function getCoordsForLocation(ville) {
            const v = _normCity(ville);
            if (!v) return null;

            // 1. Correspondance exacte
            if (GEO[v]) return GEO[v];

            // 2. Nettoyer le suffixe département : "Marignane - 13", "Nice (06)", "Paris, 75"
            const stripped = v.replace(/\s*[-–,]\s*\d+.*$/, '').replace(/\s*\(\d+\).*$/, '').trim();
            if (stripped !== v && GEO[stripped]) return GEO[stripped];

            // 3. Supprimer les suffixes ordinaux d'arrondissements : "8ème" → "8", "3e" → "3"
            const stripOrdinal = s => s.replace(/(\d+)\s*(i?eme|ieme|ère|ere|er|e)\b/g, '$1').trim();
            const vNoOrd = stripOrdinal(v);
            if (vNoOrd !== v && GEO[vNoOrd]) return GEO[vNoOrd];
            const strippedNoOrd = stripOrdinal(stripped);
            if (GEO[strippedNoOrd]) return GEO[strippedNoOrd];

            // 4. Préfixe avec frontière de mot (clés longues en premier pour éviter "marseille 1" avant "marseille 13")
            const candidates = [v, stripped, vNoOrd, strippedNoOrd].filter((s, i, a) => s && a.indexOf(s) === i);
            const sortedKeys = Object.keys(GEO).sort((a, b) => b.length - a.length);
            for (const c of candidates) {
                for (const key of sortedKeys) {
                    if (c === key) continue;
                    if (c.length > key.length) {
                        const ch = c[key.length];
                        if (c.startsWith(key) && (ch === ' ' || ch === '-' || ch === ',' || ch === '(')) return GEO[key];
                    } else if (key.length > c.length) {
                        const ch = key[c.length];
                        if (key.startsWith(c) && (ch === ' ' || ch === '-')) return GEO[key];
                    }
                }
            }
            return null;
        }

        function toggleMap() {
            _mapVisible = !_mapVisible;
            const container = document.getElementById('mapContainer');
            const btn = document.getElementById('btnToggleMap');
            if (_mapVisible) {
                container.classList.remove('hidden');
                btn.classList.add('bg-[#1A4E8A]', 'text-white', 'border-[#1A4E8A]');
                btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                if (!_map) {

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

        function refreshMapMarkers() {
            if (!_map || !_mapVisible) return;
            _markerGroup.clearLayers();
            const bounds = [];
            _lastRendered.forEach(o => {
                const coords = getCoordsForLocation(o.ville);
                if (!coords) return;
                const jitter = () => (Math.random() - 0.5) * 0.0015;
                const ll = [coords[0] + jitter(), coords[1] + jitter()];
                bounds.push(ll);

                const qn = normalizeStr(o.qualite || "");
                let markerColor = "#64748b";
                if (qn.includes("verifi")) markerColor = "#059669";
                else if (qn.includes("qualifier")) markerColor = "#d97706";
                else if (qn.includes("obsolete")) markerColor = "#dc2626";
                const en = normalizeStr(o.etat || "");
                const isShared = en.includes("partag") && !en.includes("non");
                if (isShared) markerColor = "#1A4E8A";

                const label = (o.poste || 'Offre').length > 24 ? (o.poste || 'Offre').slice(0, 22) + '…' : (o.poste || 'Offre');
                const marker = L.marker(ll, {
                    icon: L.divIcon({
                        html: `<div style="background:${markerColor};color:#fff;font-weight:900;font-size:10px;padding:3px 8px;border-radius:20px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer">${label}</div>`,
                        className: '', iconAnchor: [0, 10]
                    })
                });
                const dateStr = !isNaN(new Date(o.date)) ? new Date(o.date).toLocaleDateString('fr-FR') : '—';
                marker.bindPopup(`
                    <div style="font-family:sans-serif;min-width:200px;padding:4px">
                        <div style="font-weight:900;font-size:13px;color:${markerColor};margin-bottom:4px">${o.poste || 'Sans titre'}</div>
                        <div style="font-size:12px;font-weight:700;color:#F26522;margin-bottom:4px">🏢 ${o.entreprise || '—'}</div>
                        <div style="font-size:11px;color:#666;margin-bottom:6px">📍 ${o.ville || '—'}</div>
                        <div style="font-size:11px;color:#888">📅 ${dateStr} · N° ${o.id || '—'}</div>
                        <div style="font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid #eee">
                            <span style="font-weight:700">${o.qualite || '—'}</span> · ${o.etat || '—'}
                        </div>
                        ${o.url ? `<a href="${o.url}" target="_blank" style="font-size:11px;color:#1A4E8A;font-weight:700;display:block;margin-top:6px">Voir l'annonce ↗</a>` : ''}
                    </div>`);
                _markerGroup.addLayer(marker);
            });
            if (bounds.length > 0) {
                try { _map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 }); } catch(e) {}
            }
            setTimeout(() => _map.invalidateSize(), 100);
        }

        // INITIALISATION
        loadOffres();
    </script>
<script>(function(){var SIX_H=6*60*60*1000;function touch(){localStorage.setItem('_lastAct',Date.now());}function check(){var t=parseInt(localStorage.getItem('_lastAct')||'0',10);if(t&&Date.now()-t>SIX_H){localStorage.clear();window.location.href='index.html';}}touch();['click','keydown','mousemove','touchstart'].forEach(function(e){document.addEventListener(e,touch,true);});setInterval(check,60000);})();</script>
</body>
