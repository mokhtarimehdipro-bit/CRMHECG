    <main class="max-w-7xl mx-auto p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-black text-[#1A4E8A]">Bourse aux Offres</h1>
            <div class="flex gap-3 items-center">
                <button id="btnTogglePartagee" onclick="togglePartagee()" class="px-4 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm hover:bg-gray-200 transition">Voir les partagées (0)</button>
                <button id="btnToggleObsolete" onclick="toggleObsolete()" class="px-4 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-sm hover:bg-gray-200 transition">Voir les obsolètes (0)</button>
                <button onclick="toggleMap()" id="btnToggleMap" class="px-4 py-3 bg-white border border-gray-200 rounded-xl font-bold text-sm text-gray-600 hover:bg-gray-50 transition">🗺️ Carte</button>
                <button onclick="openModal()" class="bg-[#F26522] text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:scale-105 transition">+ Ajouter une offre</button>
            </div>
        </div>

        <div id="statsSection" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3 mb-6"></div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 items-center">
            <input type="text" id="fOffreRecherche" onkeyup="filterOffres()" placeholder="🔍 Chercher un N° (OFR...) ou Titre" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A]">

            <select id="fOffreQualite" onchange="filterOffres()" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A]">
                <option value="">🎯 Toutes les qualités (Statut)</option>
                <option value="vérifiée">✅ Vérifiée (Valide)</option>
                <option value="qualifier">❓ À Qualifier</option>
                <option value="obsolète">❌ Obsolète</option>
            </select>

            <select id="fOffrePartage" onchange="filterOffres()" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A]">
                <option value="">📡 Tous les partages</option>
                <option value="partagée">Partagée aux étudiants</option>
                <option value="non partagée">Non partagée</option>
            </select>

            <select id="fOffreVille" onchange="filterOffres()" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A]">
                <option value="">📍 Toutes les villes</option>
            </select>

            <select id="fOffreEntreprise" onchange="filterOffres()" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A]">
                <option value="">🏢 Toutes les entreprises</option>
            </select>

            <input type="date" id="fOffreDate" onchange="filterOffres()" title="Filtrer par date de parution" class="w-full border-2 border-gray-100 p-3 rounded-2xl text-sm font-bold outline-none focus:border-[#1A4E8A] text-gray-500">
        </div>

        <div id="loader" class="text-center py-20 font-black text-[#1A4E8A] animate-pulse">Chargement des annonces...</div>

        <div id="mapContainer" class="hidden mb-8">
            <div id="mapView" style="height:480px;border-radius:1.5rem;overflow:hidden;border:1px solid #e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.08)"></div>
        </div>

        <div id="offresGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
    </main>

    <div id="offreModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-[60] p-4">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl">
            <h2 id="modalTitle" class="text-2xl font-black text-[#1A4E8A] mb-6">Fiche de l'Offre</h2>
            <input type="hidden" id="formOffreId">
            
            <div class="space-y-4">
                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                    <label class="block text-[10px] font-black text-[#1A4E8A] mb-1 uppercase tracking-widest">Titre du poste *</label>
                    <input type="text" id="offrePoste" placeholder="Ex: Assistant(e) Marketing Digital" class="w-full border-none bg-transparent text-lg font-black outline-none focus:ring-0" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Entreprise *</label>
                        <input type="text" id="offreEnt" class="w-full border p-3 rounded-xl font-bold" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Plateforme / Source</label>
                        <input type="text" id="offrePlateforme" placeholder="Indeed, LinkedIn..." class="w-full border p-3 rounded-xl">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Lien de l'annonce (URL) *</label>
                    <input type="url" id="offreUrl" class="w-full border p-3 rounded-xl text-blue-500 font-medium" required>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">📍 Ville</label>
                        <input type="text" id="offreVille" placeholder="Ex: Marseille 13e, Aix..." class="w-full border p-3 rounded-xl font-bold text-sm outline-none focus:border-[#1A4E8A]">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Qualité</label>
                        <select id="offreQualite" class="w-full border p-3 rounded-xl font-bold text-sm">
                            <option value="Vérifiée">✅ Vérifiée</option>
                            <option value="À Qualifier">❓ À Qualifier</option>
                            <option value="Obsolète">❌ Obsolète</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Statut partage</label>
                        <select id="offreEtat" class="w-full border p-3 rounded-xl font-bold text-sm">
                            <option value="Non partagée">📭 Non partagée</option>
                            <option value="Partagée">📡 Partagée</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-orange-500 mb-1 uppercase">📝 (notes interne) - Suivi équipe</label>
                    <textarea id="offreMissions" rows="3" class="w-full border p-3 rounded-xl text-sm" placeholder="Détails..."></textarea>
                </div>
            </div>

            <div class="mt-8 flex justify-end space-x-3 border-t pt-6">
                <button onclick="closeModal()" class="px-6 py-3 text-gray-400 font-bold hover:text-gray-600">Annuler</button>
                <button onclick="saveOffre()" id="btnSaveOffre" class="px-8 py-3 bg-[#1A4E8A] text-white font-black rounded-xl shadow-lg hover:bg-blue-800 transition">Enregistrer</button>
            </div>
        </div>
    </div>

   <div id="shareModal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-md border border-gray-100">
            <h2 class="text-2xl font-black text-[#1A4E8A] mb-2">📡 Partager l'offre</h2>
            <p id="shareOffreTitle" class="text-[#F26522] text-sm mb-4 font-bold truncate"></p>
            <p class="text-[10px] text-gray-500 mb-6 italic leading-tight">Note: L'envoi est automatiquement restreint aux <b>Inscrits/Préinscrits</b> ayant le statut <b>En recherche</b>.</p>
            
            <input type="hidden" id="shareOffreId">
            
            <div class="space-y-4">
                <div class="pb-4 border-b border-gray-100">
                    <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-50 rounded-xl transition">
                        <input type="checkbox" id="checkTous" class="w-5 h-5 text-[#1A4E8A] rounded" checked onchange="toggleClassesSelection()">
                        <span class="font-black text-gray-800 text-sm tracking-wide">Toutes les classes éligibles</span>
                    </label>
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 tracking-widest">Ou cibler des classes :</label>
                    <div id="zoneClasses" class="space-y-1 opacity-50 pointer-events-none max-h-40 overflow-y-auto custom-scrollbar">
                        </div>
                </div>

                <div class="pt-4 space-y-2">
                    <button onclick="confirmShare()" id="btnConfirmShare" class="w-full py-4 bg-[#F26522] text-white rounded-2xl font-black shadow-lg hover:scale-[1.02] transition-all">🚀 DIFFUSER L'OFFRE</button>
                    <button onclick="closeShareModal()" class="w-full py-3 text-slate-400 font-bold text-sm hover:text-slate-600 hover:bg-slate-50 rounded-xl">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL STATS DETAIL -->
    <div id="statsModal" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-[70] p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-4">
                <h3 id="statsModalTitle" class="text-xl font-black text-[#1A4E8A]"></h3>
                <button onclick="closeStatsModal()" class="text-gray-300 hover:text-gray-600 font-black text-2xl leading-none">×</button>
            </div>
            <div id="statsModalList" class="overflow-y-auto flex-1 custom-scrollbar pr-2 space-y-0"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwfwxfVa2968AgKLdwwV8VIazVACVPVypKXrEUTc-zTuQ08gda8m5_qPfC2BgMyJMwb/exec";
        
        let currentOffres = [];
        let listEtu = [];
        let showObsolete = false;
        let showPartagee = false;
        let _statsClickData = [];

        // --- POSTIER CENTRAL ---
        async function apiPost(payload) {
            const userSession = JSON.parse(localStorage.getItem('user') || '{}');
            payload.idAuteur = userSession.nom || "Utilisateur Inconnu";
            payload.roleAuteur = userSession.role || "Utilisateur";
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                return await response.json();
            } catch (e) {
                console.error("Erreur API :", e);
                return { success: false, message: "Erreur réseau." };
            }
        }

        // 1. LE CHARGEUR (Récupère la donnée et la stocke)
        async function loadOffres() {
            const loader = document.getElementById('loader');
            try {
                loader.classList.remove('hidden');
                document.getElementById('offresGrid').classList.add('hidden');

                const data = await apiPost({ action: 'getOffres' });

                loader.classList.add('hidden');
                document.getElementById('offresGrid').classList.remove('hidden');

                if (data.success && data.data && data.data.length > 0) {
                    currentOffres = data.data;
                    populateVilleFilter();
                    populateEntrepriseFilter();
                    renderStats(computeStats());
                    updateToggleBtns();
                    filterOffres();
                } else {
                    document.getElementById('offresGrid').innerHTML = '<div class="col-span-full text-center py-20 bg-white rounded-[2rem] border border-dashed border-gray-200"><p class="text-gray-400 italic font-bold">Aucune offre disponible.</p></div>';
                }
            } catch (err) {
                loader.innerHTML = '<p class="text-red-500 font-bold uppercase text-xs">⚠️ Erreur de communication</p>';
            }
        }

        function populateVilleFilter() {
            const sel = document.getElementById('fOffreVille');
            const villes = [...new Set(currentOffres.map(o => (o.ville || "").trim()).filter(Boolean))].sort();
            sel.innerHTML = '<option value="">📍 Toutes les villes</option>' + villes.map(v => `<option value="${v}">${v}</option>`).join('');
        }

        function populateEntrepriseFilter() {
            const sel = document.getElementById('fOffreEntreprise');
            const entreprises = [...new Set(currentOffres.map(o => (o.entreprise || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
            sel.innerHTML = '<option value="">🏢 Toutes les entreprises</option>' + entreprises.map(e => `<option value="${e}">${e}</option>`).join('');
        }

        // 2. LE MOTEUR DE FILTRAGE
        function filterOffres() {
            const elSearch = document.getElementById('fOffreRecherche');
            if (!elSearch) return renderOffres(currentOffres);

            const search = document.getElementById('fOffreRecherche').value.toLowerCase().trim();
            const qualite = document.getElementById('fOffreQualite').value.toLowerCase();
            const partage = document.getElementById('fOffrePartage').value.toLowerCase();
            const villeFilter = (document.getElementById('fOffreVille').value || "").trim();
            const entrepriseFilter = (document.getElementById('fOffreEntreprise').value || "").trim();
            const dateFilter = document.getElementById('fOffreDate').value; // "YYYY-MM-DD" ou ""

            let filteredData = currentOffres.filter(o => {
                const textGlobal = `${o.id || ''} ${o.poste || ''} ${o.entreprise || ''} ${o.ville || ''}`.toLowerCase();
                const matchSearch = textGlobal.includes(search);

                const qualiteOffre = (o.qualite || "").toLowerCase();
                const matchQualite = qualite === "" || qualiteOffre.includes(qualite);

                let etatOffre = (o.etat || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                let estPartage = etatOffre.includes("partagee") || etatOffre.includes("partage");
                if (etatOffre.includes("non")) estPartage = false;
                let matchPartage = true;
                if (partage === "partagée") matchPartage = estPartage === true;
                if (partage === "non partagée") matchPartage = estPartage === false;

                const matchVille = !villeFilter || (o.ville || "") === villeFilter;
                const matchEntreprise = !entrepriseFilter || (o.entreprise || "").trim() === entrepriseFilter;

                let matchDate = true;
                if (dateFilter) {
                    const d = new Date(o.date);
                    if (isNaN(d)) {
                        matchDate = false;
                    } else {
                        const [y, m, day] = dateFilter.split('-').map(Number);
                        matchDate = d.getFullYear() === y && (d.getMonth() + 1) === m && d.getDate() === day;
                    }
                }

                return matchSearch && matchQualite && matchPartage && matchVille && matchEntreprise && matchDate;
            });

            // Masquer les obsolètes par défaut
            if (!showObsolete) {
                filteredData = filteredData.filter(o => {
                    const q = (o.qualite || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                    return !q.includes("obsolete");
                });
            }

            // Masquer les partagées par défaut
            if (!showPartagee) {
                filteredData = filteredData.filter(o => {
                    const e = (o.etat || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
                    const estPartage = (e.includes("partag")) && !e.includes("non");
                    return !estPartage;
                });
            }

            renderOffres(filteredData);
            refreshMapMarkers();
        }

        // 3. LE DESSINATEUR (Génère le HTML)
        function renderOffres(data) {
            _lastRendered = data;
            const grid = document.getElementById('offresGrid');
            if(data.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-10"><p class="text-gray-400 font-bold italic">Aucune offre ne correspond à ces filtres.</p></div>';
                return;
            }
            
            grid.innerHTML = data.map(o => {
                let nomPlateforme = o.Plateforme || o.plateforme || "Inconnu";
                let pf = nomPlateforme.toLowerCase();
                let logoHTML = `<span class="px-2 py-1 text-[10px] font-bold text-gray-600 bg-gray-100 rounded shadow-sm">${nomPlateforme}</span>`; 
                
                if (pf.includes("linkedin")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=linkedin.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="LinkedIn">`;
                else if (pf.includes("indeed")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=indeed.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="Indeed">`;
                else if (pf.includes("france travail") || pf.includes("francetravail") || pf.includes("pole emploi")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=francetravail.fr&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="France Travail">`;
                else if (pf.includes("google")) logoHTML = `<img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" class="h-6 w-6 object-contain rounded-md shadow-sm" title="Google Jobs">`;

                let brutQualite = o.qualite || "À QUALIFIER";
                let qualiteTexte = brutQualite.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                let bgCarte = "bg-white border-gray-100"; 
                let badgeQualite = "bg-gray-100 text-gray-600 border-gray-200";

                if (qualiteTexte.includes("qualifier")) { bgCarte = "bg-yellow-50 border-yellow-400"; badgeQualite = "bg-yellow-100 text-yellow-800 border-yellow-300"; } 
                else if (qualiteTexte.includes("obsolete") || qualiteTexte.includes("annule")) { bgCarte = "bg-red-50 border-red-300 opacity-80"; badgeQualite = "bg-red-100 text-red-800 border-red-200"; } 
                else if (qualiteTexte.includes("valide") || qualiteTexte.includes("vérifiée")) { bgCarte = "bg-green-50 border-green-400"; badgeQualite = "bg-green-100 text-green-800 border-green-300"; }

                let brutEtat = o.etat || "Non partagée";
                let etatTexte = brutEtat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                let estPartage = etatTexte.includes("partagee") || etatTexte.includes("partage");
                if (etatTexte.includes("non")) estPartage = false; 
                let badgePartage = estPartage ? "bg-blue-100 text-blue-800 border-blue-300" : "bg-slate-100 text-slate-500 border-slate-200";

                const safePoste = (o.poste || "").replace(/'/g, "\\'");
                const namesHTML = estPartage && o.destinataires && o.destinataires.length > 0 
                    ? `<details class="mt-3 group">
                         <summary class="text-[9px] font-black text-blue-500 cursor-pointer uppercase list-none focus:outline-none hover:underline">
                            👥 Voir les ${o.destinataires.length} partages
                         </summary>
                         <div class="flex flex-wrap gap-1 mt-2 p-2 bg-white/50 rounded-xl border border-blue-100">
                            ${o.destinataires.map(name => `<span class="px-2 py-0.5 bg-white text-[#1A4E8A] rounded text-[9px] font-bold border border-blue-100 shadow-sm">${name}</span>`).join('')}
                         </div>
                       </details>`
                    : `<p class="text-[9px] text-slate-400 italic mt-3 font-bold uppercase tracking-tighter">Aucun partage effectué</p>`;

                return `
                <div class="${bgCarte} rounded-[2rem] shadow-sm border p-6 flex flex-col justify-between hover:shadow-xl transition-all duration-300 group">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex gap-2">
                                <span class="px-2 py-1 text-[10px] font-black uppercase rounded border shadow-sm ${badgeQualite}">${brutQualite}</span>
                                <span class="px-2 py-1 text-[10px] font-black uppercase rounded border shadow-sm ${badgePartage}">${brutEtat}</span>
                            </div>
                            <div class="ml-2">${logoHTML}</div>
                        </div>
                        <span class="text-[10px] font-black text-slate-400 mb-1 block">N° ${o.id || '-'}</span>
                        <h3 class="text-xl font-black text-gray-800 mb-1 leading-tight group-hover:text-[#1A4E8A] transition-colors">${o.poste || 'Sans titre'}</h3>
                        <p class="text-[#F26522] font-black text-sm mb-1 uppercase">🏢 ${o.entreprise}</p>
                        ${o.ville ? `<p class="text-[10px] font-bold text-slate-500 mb-3">📍 ${o.ville}</p>` : '<p class="mb-3"></p>'}
                        <p class="text-[10px] font-bold text-gray-400 tracking-tighter mb-2">📅 Parue le ${new Date(o.date).toLocaleDateString()}</p>
                        <div class="mt-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                            <p class="text-[9px] font-black text-gray-400 uppercase mb-1">📝 (notes interne) :</p>
                            <p class="text-[11px] text-gray-600 font-medium italic leading-snug">${o.missions || 'Aucune note.'}</p>
                        </div>
                        ${namesHTML}
                    </div>
                    <div class="flex justify-between items-center mt-8 border-t border-gray-50 pt-4">
                        <a href="${o.url}" target="_blank" class="text-blue-500 font-black text-[10px] hover:underline uppercase tracking-widest">Voir l'annonce ↗</a>
                        <div class="flex space-x-1">

                id: document.getElementById('formOffreId').value,
                poste: document.getElementById('offrePoste').value,

        function normalizeStr(s) {
            return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
        }

        function computeStats() {
            const now = new Date();
            const dow = now.getDay();
            const diffToMon = (dow === 0 ? -6 : 1 - dow);
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() + diffToMon);
            weekStart.setHours(0, 0, 0, 0);

            const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
            const aujourdhui = currentOffres.filter(o => {
                const d = new Date(o.date);
                return !isNaN(d) && d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
            });
            const cetteSemaine = currentOffres.filter(o => {
                const d = new Date(o.date);
                return !isNaN(d) && d >= weekStart;
            });
            const aQualifier = currentOffres.filter(o => normalizeStr(o.qualite).includes("qualifier"));
            const partagees   = currentOffres.filter(o => {
                const e = normalizeStr(o.etat);
                return e.includes("partag") && !e.includes("non");
            });
            const obsoletes  = currentOffres.filter(o => normalizeStr(o.qualite).includes("obsolete"));
            const verifiees  = currentOffres.filter(o => normalizeStr(o.qualite).includes("verifi"));

            let moyParSemaine = "—";
            const validDates = currentOffres.map(o => new Date(o.date)).filter(d => !isNaN(d));
            if (validDates.length > 0) {
                const firstDate = new Date(Math.min(...validDates.map(d => d.getTime())));
                const weeksSince = Math.max(1, (now - firstDate) / (7 * 24 * 60 * 60 * 1000));
                moyParSemaine = (currentOffres.length / weeksSince).toFixed(1);
            }

            return { aujourdhui, cetteSemaine, total: currentOffres.length, moyParSemaine, aQualifier, partagees, obsoletes, verifiees };
        }

                { label: "Total captées",   value: st.total,               sub: "depuis le début",color: "indigo",  data: currentOffres  },
                { label: "Moy. / semaine",  value: st.moyParSemaine,       sub: "offres/sem.",    color: "violet",  data: null           },

                        <div style="font-weight:900;font-size:13px;color:${markerColor};margin-bottom:4px">${o.poste || 'Sans titre'}</div>
                        <div style="font-size:12px;font-weight:700;color:#F26522;margin-bottom:4px">🏢 ${o.entreprise || '—'}</div>
                        <div style="font-size:11px;color:#666;margin-bottom:6px">📍 ${o.ville || '—'}</div>
                        <div style="font-size:11px;color:#888">📅 ${dateStr} · N° ${o.id || '—'}</div>
                        <div style="font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid #eee">
                            <span style="font-weight:700">${o.qualite || '—'}</span> · ${o.etat || '—'}
                        </div>
                        ${o.url ? `<a href="${o.url}" target="_blank" style="font-size:11px;color:#1A4E8A;font-weight:700;display:block;margin-top:6px">Voir l'annonce ↗</a>` : ''}
                    </div>`);
                _markerGroup.addLayer(marker);
            });
            if (bounds.length > 0) {
                try { _map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 }); } catch(e) {}
            }
            setTimeout(() => _map.invalidateSize(), 100);
        }

        // INITIALISATION
        loadOffres();
    </script>
</body>
</html>
